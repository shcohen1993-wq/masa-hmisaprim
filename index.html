function genChart(i){const d=D(i);const S0=pick(CHSETS);const cfg=d===0?{max:10,step:1,lab:2,mul:1,top:true}:d===1?{max:30,step:5,lab:5,mul:5,top:true}:{max:20,step:2,lab:4,mul:2,top:false};
  const vals=shuffle([...Array(cfg.max/cfg.mul)].map((_,k)=>(k+1)*cfg.mul)).slice(0,4);const data=S0.l.map((l,k)=>({l,v:vals[k]}));const ch=hl=>chartSVG({...cfg,data,hl});
  const t=['count','most','total','count','diff','total','least','diff'][i]||pick(['count','most','total','diff']);const intro=`<span class="wptxt">${S0.t}${cfg.top?'':' (אין מספרים מעל העמודות – קוראים את הציר!)'}</span>`;
  if(t==='count'){const k=R(0,3),v=vals[k];return{prompt:intro+S0.ask(S0.l[k]),visual:ch([]),answer:v,choices:near(v,[cfg.mul,-cfg.mul,cfg.mul*2,1],1),hint:cfg.top?'חפשו את העמודה, וקראו את המספר שמעליה.':'עקבו עם האצבע מראש העמודה אל המספרים בצד.',explain:`${vis(ch([k]))}<p>העמודה של ${S0.l[k]} מגיעה ל-${v}.</p>`,review:`${S0.l[k]}: ${v}`}}
  if(t==='most'||t==='least'){const v=t==='most'?Math.max(...vals):Math.min(...vals),k=vals.indexOf(v);return{prompt:intro+S0[t],visual:ch([]),answer:S0.l[k],choices:S0.l.slice(),small:true,hint:`חפשו את העמודה ה${t==='most'?'גבוהה':'נמוכה'} ביותר.`,explain:`${vis(ch([k]))}<p>העמודה ה${t==='most'?'גבוהה':'נמוכה'} ביותר היא של ${S0.l[k]}: ${v}.</p>`,review:`${S0[t]} – ${S0.l[k]}`}}
  if(t==='total'){const sum=vals.reduce((a,b)=>a+b,0);const lines=[];let acc=vals[0];for(let k=1;k<4;k++){lines.push(`${acc} + ${vals[k]} = ${acc+vals[k]}`);acc+=vals[k]}const skip=R(0,3);
    return{prompt:intro+S0.total,visual:ch([]),answer:sum,choices:choicesFrom(sum,shuffle([sum-vals[skip],sum+cfg.mul,sum-cfg.mul*2,sum+10]),1),hint:'מחברים את כל 4 העמודות, אחת אחרי השנייה.',explain:`${vis(ch([0,1,2,3]))}${steps(lines)}<p class="alt">חשוב: סופרים את כל 4 העמודות. מי שמדלג על ${S0.l[skip]} מקבל ${sum-vals[skip]} – וזה לא נכון.</p>`,review:`בסך הכל: ${vals.join(' + ')} = ${sum}`}}
  let x=R(0,3),y;do y=R(0,3);while(y===x);if(vals[x]<vals[y])[x,y]=[y,x];const df=vals[x]-vals[y];
  return{prompt:intro+S0.diff(S0.l[x],S0.l[y]),visual:ch([]),answer:df,choices:choicesFrom(df,shuffle([vals[x],vals[x]+vals[y],df+cfg.mul,df-cfg.mul]),1),hint:'בכמה יותר? מחסרים את הקטן מהגדול.',explain:`${vis(ch([x,y]))}<p>${S0.l[x]}: ${vals[x]}, ${S0.l[y]}: ${vals[y]}. מחסרים: ${eq(`${vals[x]} − ${vals[y]} = ${df}`)}</p>`,review:`${vals[x]} − ${vals[y]} = ${df}`}}

/* time */
function addMin(h,m,dm){const t=h*60+m+dm;return[Math.floor(t/60),t%60]}
function endLines(sh,sm,dur){const[eh,em]=addMin(sh,sm,dur);if(sm+dur<60||(sm===0&&dur%60===0))return[`${fmtT(sh,sm)} + ${dur} = ${fmtT(eh,em)}`];const L=[];
  if(sm>0){const need=60-sm,rest=dur-need;L.push(`${fmtT(sh,sm)} + ${need} = ${fmtT(sh+1,0)}`);if(rest>=60){L.push(`${fmtT(sh+1,0)} + 60 = ${fmtT(sh+2,0)}`);if(rest>60)L.push(`${fmtT(sh+2,0)} + ${rest-60} = ${fmtT(eh,em)}`)}else if(rest>0)L.push(`${fmtT(sh+1,0)} + ${rest} = ${fmtT(eh,em)}`)}
  else{L.push(`${fmtT(sh,0)} + 60 = ${fmtT(sh+1,0)}`);if(dur>60)L.push(`${fmtT(sh+1,0)} + ${dur-60} = ${fmtT(eh,em)}`)}return L}
const TSTORY=[['השיעור','מתחיל','נמשך','נגמר'],['הסרט','מתחיל','נמשך','נגמר'],['האימון','מתחיל','נמשך','נגמר'],['ההפסקה','מתחילה','נמשכת','נגמרת']];
function genTime(i){const d=D(i);const t=['min','read','end','read','end','min','dur','end'][i]||pick(['read','end','dur']);
  if(t==='min'){const[q,ans]=pick(d===0?[['בשעה אחת שלמה',60],['בחצי שעה',30]]:[['ברבע שעה',15],['בשעה וחצי',90],['בשלושה רבעי שעה',45],['בשעתיים',120],['בחצי שעה',30]]);
    return{prompt:`כמה דקות יש ${q}?`,visual:'',answer:ans,choices:choicesFrom(ans,shuffle([60,30,15,45,90,100,50,120]),1),hint:'בשעה שלמה יש 60 דקות. מחלקים או מוסיפים לפי מה ששואלים.',explain:`<div class="kw"><div><b>שעה</b><span>60 דקות</span></div><div><b>חצי שעה</b><span>${eq('60 ÷ 2 = 30')}</span></div><div><b>רבע שעה</b><span>${eq('60 ÷ 4 = 15')}</span></div><div><b>שעה וחצי</b><span>${eq('60 + 30 = 90')}</span></div></div>`,review:`${q} יש ${ans} דקות`}}
  if(t==='read'){const h=R(1,12),m=d===0?pick([0,30]):d===1?pick([0,15,30,45]):5*R(1,11);const ans=fmtT(h,m),nh=h%12+1,ph=h===1?12:h-1;const c=[fmtT(nh,m),fmtT(h,(m+30)%60),fmtT(ph,m)];if(m)c.unshift(fmtT(m/5,h===12?0:h*5));const mm=m/5||12;
    const txt=m===0?`המחוג הארוך על ה-12 – שעה עגולה. המחוג הקצר על ה-${h}.`:`המחוג הארוך על ה-${mm}: ${eq(`${mm} × 5 = ${m}`)} דקות. המחוג הקצר ${m>=30?`כבר קרוב ל-${nh}, אבל עוד לא הגיע – לכן השעה עדיין ${h}`:`קצת אחרי ה-${h}`}.`;
    return{prompt:'מה השעה בשעון?',visual:clockFace(h,m,190),answer:ans,choices:choicesStr(ans,c),small:true,render:tS,hint:'המחוג הקצר – שעות. המחוג הארוך – דקות (כל מספר = 5 דקות).',explain:`${vis(clockFace(h,m,160))}<p>${txt}</p><p>השעה: <b dir="ltr">${ans}</b></p>`,review:`השעון מראה ${ans}`}}
  if(t==='end'){const sh=R(7,10),sm=d===0?0:d===1?pick([0,30]):pick([15,30,45]);const dur=d===0?pick([30,60]):d===1?pick([15,30,45,60]):pick([30,45,60,90]);const[eh,em]=addMin(sh,sm,dur);const ans=fmtT(eh,em);const st=pick(TSTORY);

      explain:`${clockPair([sh,sm],[eh,em])}${steps(endLines(sh,sm,dur))}${bad?`<p class="alt">זהירות: אין דבר כזה ${tS(bad)}! אחרי 59 דקות מתחילה שעה חדשה, כמו שמשלימים לעשר.</p>`:''}`,review:`${fmtT(sh,sm)} ועוד ${dur} דקות = ${ans}`}}
  const sh=R(7,10),sm=pick([0,15,30]),dur=pick([15,30,45,60,75]);const[eh,em]=addMin(sh,sm,dur);const st=pick([['המשחק','מתחיל','נגמר'],['הטיול','מתחיל','נגמר'],['השיעור','מתחיל','נגמר']]);const trap=(eh-sh)*100+(em-sm);

  if(p.type==='bars'){const L=['תפוח','בננה','ענבים','תות'];const sum=p.v.reduce((a,b)=>a+b,0),mx=Math.max(...p.v);v=chartSVG({data:L.map((l,i)=>({l,v:p.v[i]})),max:10,step:1,lab:2,top:true})+`<div class="pbig" style="font-size:26px">${p.v.join(' + ')} = ${sum}</div>`;c=L.map((l,i)=>btn('b'+i,`+1 ${l}`)).join('')+btn('reset','איפוס');if(!m)m=sum===0?'לחצו כדי לבנות עמודות!':p.v.filter(x=>x===mx).length>1?'יש תיקו בראש!':`הכי הרבה: ${L[p.v.indexOf(mx)]}. בסך הכל ${sum}.`}
  if(p.type==='clock'){v=clockFace(p.h,p.m,190)+`<div class="pbig" dir="ltr">${fmtT(p.h,p.m)}</div>`;c=btn('m-5','− 5 דק׳')+btn('m+5','+ 5 דק׳')+btn('m+15','+ רבע שעה')+btn('h+1','+ שעה');if(!m)m=p.m===0?'שעה עגולה: המחוג הארוך על ה-12.':p.m===30?'חצי שעה: המחוג הארוך על ה-6.':p.m===15?'רבע שעה: המחוג הארוך על ה-3.':p.m===45?'שלושה רבעי שעה: המחוג הארוך על ה-9.':`המחוג הארוך על ה-${p.m/5}: ${p.m/5} × 5 = ${p.m} דקות.`}
  return v?{v,c,m}:null}
function playOpC(p,op){const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  if(p.type==='shape'){p.n=cl(p.n+(op==='n+1'?1:-1),3,8);sfx.tick();return true}
  if(p.type==='rect'){const k=op[0];p[k]=cl(p[k]+(op.endsWith('+1')?1:-1),1,9);if(p.w===p.h)sfx.good();else sfx.tick();return true}
  if(p.type==='bars'){if(op==='reset')p.v=[0,0,0,0];else{const k=+op.slice(1);p.v[k]=p.v[k]>=10?0:p.v[k]+1}sfx.tick();return true}
  if(p.type==='clock'){const k=op[0],dl=+op.slice(1);if(k==='h')p.h=p.h%12+1;else{const before=p.m;let t=((p.h%12)*60+p.m+dl)%720;if(t<0)t+=720;p.h=Math.floor(t/60)||12;p.m=t%60;if(dl>0&&p.m<before){p.msg='60 דקות הפכו לשעה שלמה – המחוג הקצר עבר למספר הבא!';sfx.good();return true}}sfx.tick();return true}
  return false}

function ckRound(r){const lvl=r<=2?0:r<=4?1:2;
  if(r%2===1){const h=R(1,12),m=lvl===0?pick([0,30]):lvl===1?pick([15,45,30]):5*R(1,11);return{kind:'set',th:h,tm:m,h:pick([12,3,6,9].filter(x=>x!==h)),m:0,tries:0,done:false,msg:'',txt:`כוונו את השעון לשעה <b dir="ltr">${fmtT(h,m)}</b>`}}
  const sh=R(7,10),sm=lvl===0?0:pick([0,15,30,45]),dur=lvl===0?pick([30,60]):lvl===1?pick([15,30,45]):pick([30,45,60,90]);const[eh,em]=addMin(sh,sm,dur);const st=pick(TSTORY);
  return{kind:'end',th:eh,tm:em,sh,sm,dur,h:sh,m:sm,tries:0,done:false,msg:'',txt:`${st[0]} ${st[1]} בשעה <b dir="ltr">${fmtT(sh,sm)}</b> ו${st[2]} ${dur} דקות. כוונו את השעון לשעה שבה ${st[0]} ${st[3]}.`}}
function startClockG(){S.CG={round:1,stars:[],cur:ckRound(1),tok:gtoken()};go('clock')}
function vClockG(){const G=S.CG,c=G.cur;if(G.end)return endCard('clock',G.stars.reduce((a,b)=>a+b,0),18,'אלופת השעון!','המחוג הקצר – שעות, המחוג הארוך – דקות. ו-60 דקות הן שעה.',G.rec);
  const ex=c.kind==='end'?steps(endLines(c.sh,c.sm,c.dur)):`<p>המחוג הקצר ליד ה-${c.th%12||12}, והמחוג הארוך על ה-${c.tm/5||12}${c.tm?` (${c.tm/5||12} × 5 = ${c.tm} דקות)`:' – שעה עגולה'}.</p>`;
  return `${gStarsHead(G,6,'משימה')}<div class="qcard"><div class="prompt" style="font-size:20px">${c.txt}</div><div class="vis">${clockFace(c.h,c.m,220)}${c.kind==='end'||c.done?`<div class="pbig" dir="ltr">${fmtT(c.h,c.m)}</div>`:''}</div>
  ${c.done?'':`<div class="jumps" dir="ltr">${[['h-1','− שעה'],['m-5','− 5 דק׳'],['m+5','+ 5 דק׳'],['m+15','+ 15 דק׳'],['h+1','+ שעה']].map(([op,l])=>`<button class="btn ghost small" data-act="ckmove" data-id="${op}">${l}</button>`).join('')}</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-act="ckcheck">בדיקה</button></div>`}
  <div class="gmsg ${c.mcls||''}" aria-live="polite">${c.msg}</div>${c.done?`<div class="fb good">${mascot('happy')}<div class="body"><h3>${c.st>1?'השעון מכוון!':'ככה זה נראה'} ${starRow(c.st)}</h3>${ex}<div><button class="btn" data-act="cknext">${G.round<6?'למשימה הבאה':'לסיכום'}</button></div></div></div>`:''}</div>`}
function ckmove(op){const c=S.CG.cur;if(c.done)return;const k=op[0],dl=+op.slice(1);if(k==='h')c.h=((c.h-1+dl+12)%12)+1;else{let t=((c.h%12)*60+c.m+dl)%720;if(t<0)t+=720;c.h=Math.floor(t/60)||12;c.m=t%60}c.msg='';sfx.tick();render()}
function ckcheck(){const G=S.CG,c=G.cur;const tgt=(c.th%12)*60+c.tm,cv=(c.h%12)*60+c.m;
  if(tgt===cv){c.done=true;c.st=c.tries===0?3:c.tries===1?2:1;G.stars.push(c.st);tpt(c.st);c.msg='';sfx.good();if(c.st===3)confetti()}
  else{c.tries++;sfx.bad();let d=((tgt-cv)%720+720)%720;const fw=d<=360;if(!fw)d=720-d;c.msg=`השעון מראה ${tS(fmtT(c.h,c.m))}. צריך להזיז עוד ${fmtDiff(d)} ${fw?'קדימה':'אחורה'}.`;c.mcls='no';
    if(c.tries>=3){c.h=c.th%12||12;c.m=c.tm;c.done=true;c.st=1;G.stars.push(1);tpt(1);c.msg=''}}
  render()}

/* 3. build a bar chart */
const CHI=[['apple','תפוחים'],['flower','פרחים'],['fishO','דגים'],['star','כוכבים']];
const icImg=(k,s=22)=>`<img src="data:image/svg+xml,${encodeURIComponent(IC[k])}" width="${s}" height="${s}" alt="">`;
function chRound(r){const sc=r<=2?1:2;const vals=shuffle([...Array(9)].map((_,k)=>(k+1)*sc)).slice(0,4);return{sc,vals,set:[0,0,0,0],phase:'build',mist:0,bad:[],msg:'',mcls:'',q:null,qbad:[]}}
function chQuestion(c){const N=CHI.map(x=>x[1]),v=c.vals,t=pick(['most','least','total','diff']);
  if(t==='most'||t==='least'){const x=t==='most'?Math.max(...v):Math.min(...v);return{t:t==='most'?'ממה יש הכי הרבה?':'ממה יש הכי מעט?',ans:N[v.indexOf(x)],ch:N.slice(),ex:`העמודה ה${t==='most'?'גבוהה':'נמוכה'} ביותר היא של ה${N[v.indexOf(x)]}: ${x}.`}}
  if(t==='total'){const s=v.reduce((a,b)=>a+b,0);return{t:'כמה יש בסך הכל?',ans:s,ch:choicesFrom(s,shuffle([s-v[0],s+c.sc,s-c.sc*2,s+10]),1),ex:`${eq(`${v.join(' + ')} = ${s}`)} – כל 4 העמודות.`}}
  let a=R(0,3),b;do b=R(0,3);while(b===a);if(v[a]<v[b])[a,b]=[b,a];const df=v[a]-v[b];return{t:`בכמה ${N[a]} יש יותר מ${N[b]}?`,ans:df,ch:choicesFrom(df,shuffle([v[a],df+c.sc,df-c.sc,v[a]+v[b]]),1),ex:`${eq(`${v[a]} − ${v[b]} = ${df}`)}`}}
function startChartG(){S.HG={round:1,stars:[],cur:chRound(1),tok:gtoken()};go('chart')}
function vChartG(){const G=S.HG,c=G.cur;if(G.end)return endCard('chart',G.stars.reduce((a,b)=>a+b,0),12,'בנאית דיאגרמות!','עמודה גבוהה – יש יותר. ותמיד בודקים כמה שווה כל משבצת.',G.rec);
  const rows=10;const tally=`<div class="tally">${CHI.map(([k,n],i)=>`<div class="trow"><span class="tname">${icImg(k,24)} ${n}</span><span class="ticons">${icImg(k,c.sc===2?17:21).repeat(c.vals[i])}</span></div>`).join('')}</div>`;
  let g=`<div class="cbuild"><div class="caxis">${[...Array(rows)].map((_,r)=>`<span>${(rows-r)*c.sc}</span>`).join('')}</div>`;
  g+=CHI.map(([k,n],i)=>`<div class="ccol${c.bad.includes(i)?' bad':''}">${[...Array(rows)].map((_,r)=>{const lv=rows-r;return `<button class="ccell${lv<=c.set[i]?' on':''}" data-act="chset" data-c="${i}" data-v="${lv}" aria-label="${n} ${lv*c.sc}" ${c.phase!=='build'?'disabled':''}></button>`}).join('')}</div>`).join('');
  g+=`<span></span>${CHI.map(([k,n])=>`<span class="clab">${icImg(k,20)}<br>${n}</span>`).join('')}</div>`;
  let body='';if(c.phase==='build')body=`<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-act="chcheck">בדיקת הדיאגרמה</button></div>`;
  else if(c.phase==='q')body=`<div class="prompt" style="margin-top:14px">${c.q.t}</div><div class="choices">${c.q.ch.map((v,k)=>`<button class="choice${typeof v==='string'?' txt':''}${c.qbad.includes(k)?' bad':''}" data-act="chans" data-k="${k}" ${c.qbad.includes(k)?'disabled':''}>${v}</button>`).join('')}</div>`;
  else body=`<div class="fb good">${mascot('happy')}<div class="body"><h3>מצוין! ${starRow(c.st)}</h3><p>${c.q.ex}</p><div><button class="btn" data-act="chnext">${G.round<4?'לדיאגרמה הבאה':'לסיכום'}</button></div></div></div>`;
  return `${gStarsHead(G,4,'דיאגרמה')}<div class="qcard"><div class="prompt" style="font-size:19px">ספרו כמה יש מכל דבר, ובנו עמודה לכל אחד.${c.sc===2?'<br><b style="color:var(--accent)">שימו לב: כל משבצת שווה 2!</b>':''}</div>${tally}${g}<div class="gmsg ${c.mcls}" aria-live="polite">${c.msg}</div>${body}</div>`}
function chset(i,v){const c=S.HG.cur;if(c.phase!=='build')return;c.set[i]=c.set[i]===v?v-1:v;c.bad=c.bad.filter(x=>x!==i);c.msg='';sfx.tick();render()}
function chcheck(){const c=S.HG.cur;c.bad=[0,1,2,3].filter(i=>c.set[i]*c.sc!==c.vals[i]);
  if(!c.bad.length){c.phase='q';c.q=chQuestion(c);c.msg='הדיאגרמה מושלמת! עכשיו שאלה עליה:';c.mcls='ok';sfx.good()}
  else{c.mist++;sfx.bad();const i=c.bad[0],n=CHI[i][1];c.msg=c.mist>=3?`הנה התיקון: לכל ה${n} צריך ${c.vals[i]/c.sc} משבצות${c.sc===2?' (כל משבצת = 2)':''}.`:`העמודה של ה${n} לא מתאימה לתמונה. ספרו שוב${c.sc===2?', וזכרו שכל משבצת שווה 2':''}.`;c.mcls='no';if(c.mist>=3){c.set=c.vals.map(v=>v/c.sc);c.bad=[];c.phase='q';c.q=chQuestion(c)}}
  render()}
function chans(k){const G=S.HG,c=G.cur;if(c.q.ch[k]===c.q.ans){c.phase='done';c.st=Math.max(1,3-c.mist-(c.qbad.length?1:0));G.stars.push(c.st);tpt(c.st);c.msg='';sfx.good();if(c.st===3)confetti()}else{c.qbad.push(k);sfx.bad();c.msg='לא בדיוק. הסתכלו שוב על העמודות.';c.mcls='no'}render()}

/* 4. word-problem detective */
function wpRound(r){const P=wpFin(r<=2?pick(WPT)(0):r<=4?pick(WPT)(1):WPT_INV(1));const dec=pick([P.b+1,P.b-1,P.a+1,P.a-1].filter(x=>x>0&&x!==P.a&&x!==P.b));return{P,dec,chips:shuffle([P.a,P.b,dec]),slots:[null,null,null],step:1,mist:0,msg:'',mcls:'',bad2:[],bad3:[]}}
function startWPG(){S.WG={round:1,stars:[],cur:wpRound(1),tok:gtoken()};go('wp')}
function vWPG(){const G=S.WG,c=G.cur,P=c.P;if(G.end)return endCard('wp',G.stars.reduce((a,b)=>a+b,0),15,'בלשית מצטיינת!','מעתיקים בדיוק, ובתשובה במילים כותבים את התוצאה.',G.rec);
  const slot=v=>`<span class="slotbox${v!==null?' f':''}">${v===null?'':v}</span>`;
  const bar=`<div class="wpbar">${slot(c.slots[0])}${slot(c.slots[1])}${slot(c.slots[2])}<span>=</span><span class="slotbox${c.step>2?' f':''}">${c.step>2?P.r:'?'}</span></div>`;
  let body;
  if(c.step===1)body=`<p class="wpstep">שלב 1: בנו את התרגיל מהמספרים שבבעיה</p><div class="tiles">${c.chips.map(v=>`<button class="tile" data-act="wpchip" data-v="${v}">${v}</button>`).join('')}</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" data-act="wpop" data-id="+" style="font-size:24px">+</button><button class="btn ghost" data-act="wpop" data-id="−" style="font-size:24px">−</button><button class="btn ghost small" data-act="wpclear">ניקוי</button><button class="btn" data-act="wpcheck">בדיקה</button></div>`;
  else if(c.step===2)body=`<p class="wpstep">שלב 2: כמה זה?</p><div class="choices">${c.ch2.map((v,k)=>`<button class="choice${c.bad2.includes(k)?' bad':''}" data-act="wpans" data-k="${k}" ${c.bad2.includes(k)?'disabled':''}>${v}</button>`).join('')}</div>`;
  else if(c.step===3)body=`<p class="wpstep">שלב 3: מה כותבים בתשובה במילים?</p><div class="choices one">${c.ch3.map((v,k)=>`<button class="choice sentc${c.bad3.includes(k)?' bad':''}" data-act="wpsent" data-k="${k}" ${c.bad3.includes(k)?'disabled':''}>${v}</button>`).join('')}</div>`;
  else body=`<div class="fb good">${mascot('happy')}<div class="body"><h3>התיק נפתר! ${starRow(c.st)}</h3>${wpExplain(P)}<div><button class="btn" data-act="wpnext">${G.round<5?'לבעיה הבאה':'לסיכום'}</button></div></div></div>`;
  return `${gStarsHead(G,5,'בעיה')}<div class="qcard"><span class="wptxt">${P.txt.replace(/\d+/g,'<b class="num">$&</b>')}</span>${bar}${body}<div class="gmsg ${c.mcls}" aria-live="polite">${c.msg}</div></div>`}
function wpchip(v){const c=S.WG.cur;if(c.step!==1)return;if(c.slots[0]===null)c.slots[0]=v;else c.slots[2]=v;c.msg='';sfx.tick();render()}
function wpcheck(){const c=S.WG.cur,P=c.P;const[x,o,y]=c.slots;if(x===null||o===null||y===null){c.msg='צריך שני מספרים ופעולה (+ או −).';c.mcls='no';render();return}
  const ok=o===P.op&&(P.op==='+'?((x===P.a&&y===P.b)||(x===P.b&&y===P.a)):(x===P.a&&y===P.b));
  if(ok){c.step=2;c.ch2=choicesFrom(P.r,shuffle([P.op==='+'?noCarry(P.a,P.b):absDig(P.a,P.b),P.r+10,P.r-10,P.a]),0);c.msg='התרגיל נכון! עכשיו מחשבים.';c.mcls='ok';sfx.good()}
  else{c.mist++;sfx.bad();c.mcls='no';
    if(x===c.dec||y===c.dec)c.msg=`המספר ${c.dec} לא מופיע בבעיה! מעתיקים את המספרים בדיוק.`;
    else if(o!==P.op)c.msg=P.inv?'רוצים לדעת כמה היה בהתחלה? מחזירים את מה שנתן – זה חיבור.':`שימו לב למילת הרמז ״${P.key}״ – זה ${P.op==='+'?'חיבור':'חיסור'}.`;
    else if(x===y)c.msg='צריך את שני המספרים מהבעיה.';
    else c.msg='בחיסור מתחילים מהמספר של ההתחלה – הגדול.';
    c.slots=[null,null,null]}
  render()}
function wpans(k){const c=S.WG.cur,P=c.P;if(c.ch2[k]===P.r){c.step=3;c.ch3=shuffle([...new Set([P.sent(P.r),P.sent(P.a),P.sent(P.b)])]);c.msg='נכון! ועכשיו התשובה במילים.';c.mcls='ok';sfx.good()}
  else{c.mist++;c.bad2.push(k);sfx.bad();c.msg=P.op==='−'?'לא בדיוק. מתחילים מהאחדות, ואם אין מספיק – פורטים עשרת.':'לא בדיוק. מתחילים מהאחדות, ואם יוצא 10 או יותר – מעבירים 1 לעשרות.';c.mcls='no'}render()}
function wpsent(k){const G=S.WG,c=G.cur,P=c.P;if(c.ch3[k]===P.sent(P.r)){c.step=4;c.st=Math.max(1,3-c.mist);G.stars.push(c.st);tpt(c.st);c.msg='';sfx.good();if(c.st===3)confetti()}
  else{c.mist++;c.bad3.push(k);sfx.bad();c.msg=`בתשובה במילים כותבים את התוצאה של התרגיל: ${P.r}.`;c.mcls='no'}render()}

const GVIEWS=['balloons','memory','frog','tsum','shapes','clock','chart','wp','bingo','ten','flash','train','croc','shop','secret'];
let tmInt=null;
const tmKey=(id,sec)=>`${id}-t${sec}-${S.gg}`;
const tmBest=(id,sec)=>(cur().games||{})[tmKey(id,sec)];
const tmLabel=sec=>sec===60?'דקה אחת':sec===120?'שתי דקות':`${sec/60} דקות`;
function tmBegin(id){clearInterval(tmInt);const sec=cur().tmode||0;if(!sec){S.TM=null;return}S.TM={id,sec,end:Date.now()+sec*1000,pts:0,over:false};render();tmInt=setInterval(tmTick,250)}
function tmTick(){const T=S.TM;if(!T||T.over){clearInterval(tmInt);return}if(!GVIEWS.includes(S.view)){S.TM=null;clearInterval(tmInt);return}
  const left=Math.max(0,(T.end-Date.now())/1000);const b=document.getElementById('tmbar'),l=document.getElementById('tmleft');if(b)b.style.width=(left/T.sec*100)+'%';if(l)l.textContent=Math.ceil(left);
  if(left<=5&&left>0&&Math.ceil(left)!==T.beep){T.beep=Math.ceil(left);sfx.tick()}if(left<=0)tmOver()}
function tmOver(){const T=S.TM;T.over=true;clearInterval(tmInt);if(S.B)S.B.over=true;const c=cur(),k=tmKey(T.id,T.sec);T.rec=T.pts>0&&(c.games[k]===undefined||T.pts>c.games[k]);if(T.rec){c.games[k]=T.pts;save()}gameDone();render();sfx.win();if(T.rec)confetti()}
function tpt(n=1){const T=S.TM;if(!T||T.over||!n)return;T.pts+=n;const e=document.getElementById('tmpts');if(e){e.textContent=T.pts;e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}}
function tmBar(){const T=S.TM,left=Math.max(0,Math.ceil((T.end-Date.now())/1000));return `<div class="qhead tmhead" aria-label="נגד השעון"><span class="tleft"><span id="tmleft">${left}</span> <small>שניות</small></span><div class="tbar"><i id="tmbar" style="width:${left/T.sec*100}%"></i></div><span class="cscore"><span id="tmpts">${T.pts}</span> <small>נקודות</small></span></div>`}
function vTmOver(){const T=S.TM,G=GAMES.find(x=>x.id===T.id);return `<div class="result">${mascot('happy')}<h2>${T.rec?'שיא חדש!':'הזמן נגמר!'}</h2><p class="score" style="font-size:26px">${T.pts===1?'נקודה אחת':`${T.pts} נקודות`} ב${tmLabel(T.sec)}</p><p class="score">השיא שלך ב${G.title} (${tmLabel(T.sec)}): ${tmBest(T.id,T.sec)||0}</p><div class="row" style="justify-content:center"><button class="btn ghost" data-act="games">לכל המשחקים</button><button class="btn" data-act="gstart" data-id="${T.id}">עוד פעם</button></div></div>`}

const coinSVG=(v,s=50)=>{if(v>=20){const col=v===20?'#3BAA6A':'#7A5CD6';return `<svg viewBox="0 0 90 50" width="${Math.round(s*1.5)}" height="${Math.round(s*.84)}" aria-label="${v} שקלים"><rect x="2" y="2" width="86" height="46" rx="6" style="fill:${col};stroke:#1B2737;stroke-width:2"/><rect x="8" y="8" width="74" height="34" rx="4" style="fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:2"/><text x="45" y="34" style="fill:#fff;font:700 21px Fredoka,Arial;text-anchor:middle">${v} ₪</text></svg>`}

/* bingo – all grades */
function bgBoard(){const gr=S.gg,n=gr==='a'?3:4,N=n*n;const qs=[],seen=new Set();let g=0;while(qs.length<N&&g<4000){g++;const q=gq(gr);if(seen.has(q.a))continue;seen.add(q.a);qs.push(q)}
  const B={n,cells:shuffle(qs).map(q=>({q,hit:false})),cur:-1,mist:0,wcall:0,bad:-1,bingo:false,line:[],msg:'',mcls:''};bgCall(B);return B}
function bgCall(B){const open=B.cells.map((c,k)=>c.hit?-1:k).filter(k=>k>=0);B.cur=pick(open);B.wcall=0}
function bgLine(B){const n=B.n,L=[];for(let r=0;r<n;r++)L.push([...Array(n)].map((_,c)=>r*n+c));for(let c=0;c<n;c++)L.push([...Array(n)].map((_,r)=>r*n+c));L.push([...Array(n)].map((_,i)=>i*n+i));L.push([...Array(n)].map((_,i)=>i*n+n-1-i));return L.find(l=>l.every(k=>B.cells[k].hit))}
function startBingoG(){S.BG={round:1,stars:[],cur:bgBoard(),tok:gtoken()};go('bingo')}
function vBingoG(){const G=S.BG,B=G.cur;if(G.end)return endCard('bingo',G.stars.reduce((a,b)=>a+b,0),3,'בינגו!','כל תרגיל שפותרים בראש נהיה קל יותר בפעם הבאה.',G.rec);const q=B.cells[B.cur].q;
  return `<div class="qcard">${B.bingo?`<div class="prompt" style="font-size:40px;color:var(--accent)">בינגו! ${starRow(B.st)}</div>`:`<div class="prompt"><span class="eq" style="font-size:42px">${qEq(q.t).replace(/^<span class="eq" dir="ltr">|<\/span>$/g,'')}</span></div>`}
  <div class="bgrid" style="grid-template-columns:repeat(${B.n},1fr)">${B.cells.map((c,k)=>`<button class="bcell${c.hit?' hit':''}${B.line.includes(k)?' win':''}${B.bad===k?' bad':''}${B.wcall>=2&&k===B.cur?' glow':''}" data-act="bgtap" data-k="${k}" ${c.hit||B.bingo?'disabled':''}>${c.q.a}</button>`).join('')}</div>
  <div class="gmsg ${B.mcls}" aria-live="polite">${B.msg||'פתרו בראש ולחצו על התשובה בלוח.'}</div>${B.bingo?`<div class="row" style="justify-content:center"><button class="btn" data-act="bgnext">${S.TM?'ללוח חדש':'לסיום'}</button></div>`:''}</div>`}
function bgtap(k){const G=S.BG,B=G.cur;if(B.bingo||B.cells[k].hit)return;const q=B.cells[B.cur].q,solved=eq(q.t.replace('?',q.a));
  if(k===B.cur){B.cells[k].hit=true;B.bad=-1;tpt(1);sfx.good();const line=bgLine(B);if(line){B.bingo=true;B.line=line;B.st=B.mist<=1?3:B.mist<=3?2:1;G.stars.push(B.st);tpt(3);B.msg=`${solved} – וזו שורה מלאה!`;B.mcls='ok';confetti()}else{B.msg=`נכון! ${solved}`;B.mcls='ok';bgCall(B)}}
  else{B.mist++;B.wcall++;B.bad=k;sfx.bad();B.mcls='no';B.msg=B.wcall>=2?`${solved}. מצאו את ${q.a} – הוא זוהר בלוח!`:`${B.cells[k].q.a} לא מתאים. חשבו שוב.`;const tok=G.tok;setTimeout(()=>{if(S.view==='bingo'&&S.BG.tok===tok){B.bad=-1;render()}},600)}
  render()}

/* make 10 – grade א */
function tnRound(){const vals=[...Array(6)].flatMap(()=>{const a=R(1,9);return[a,10-a]});return{cards:shuffle(vals).map(v=>({v,gone:false})),sel:null,mist:0,msg:'',mcls:'',viz:'',done:false}}
function startTenG(){S.TG={round:1,stars:[],cur:tnRound(),tok:gtoken()};go('ten')}
function vTenG(){const G=S.TG,c=G.cur;if(G.end)return endCard('ten',G.stars.reduce((a,b)=>a+b,0),9,'אלופת העשר!','החברים של 10: 1 ו-9, 2 ו-8, 3 ו-7, 4 ו-6, 5 ו-5.',G.rec);
  return `${gStarsHead(G,3,'לוח')}<div class="qcard"><div class="prompt">מצאו שני קלפים שביחד הם 10</div><div class="tencards">${c.cards.map((o,k)=>`<button class="tcard${o.gone?' gone':''}${c.sel===k?' sel':''}" data-act="tntap" data-k="${k}" ${o.gone||c.done?'disabled':''}>${o.v}</button>`).join('')}</div>
  <div class="vis" style="min-height:96px">${c.viz||tenFrames(0,0,true)}</div><div class="gmsg ${c.mcls}" aria-live="polite">${c.msg}</div>${c.done?`<div class="row" style="justify-content:center">${starRow(c.st)}<button class="btn" data-act="tnnext">${G.round<3||S.TM?'ללוח הבא':'לסיכום'}</button></div>`:''}</div>`}
function tntap(k){const G=S.TG,c=G.cur;if(c.done||c.cards[k].gone)return;if(c.sel===null){c.sel=k;sfx.tick();render();return}if(c.sel===k){c.sel=null;render();return}
  const a=c.cards[c.sel].v,b=c.cards[k].v;
  if(a+b===10){c.cards[c.sel].gone=c.cards[k].gone=true;c.viz=tenFrames(a,b,true);c.msg=`${eq(`${a} + ${b} = 10`)} – לוח מלא!`;c.mcls='ok';tpt(1);sfx.good();if(c.cards.every(o=>o.gone)){c.done=true;c.st=c.mist===0?3:c.mist<=2?2:1;G.stars.push(c.st);if(c.st===3)confetti()}}
  else{c.mist++;sfx.bad();c.viz=tenFrames(a,b,true);c.msg=`${eq(`${a} + ${b} = ${a+b}`)}. ל-${a} חסר ${10-a} כדי להגיע ל-10.`;c.mcls='no'}
  c.sel=null;render()}

/* quick look – grade א */
function flRound(r){const lv=r<=3?0:r<=6?1:2;const n=lv===0?R(1,6):lv===1?R(4,10):R(8,20);const kind=lv===0&&Math.random()<.5?'dice':'tf';const c={n,kind,phase:'show',ch:near(n,[1,-1,2,-2],1),ms:[2300,1800,1500][lv],bad:[]};
  setTimeout(()=>{if(S.view==='flash'&&S.FG&&S.FG.cur===c&&c.phase==='show'){c.phase='ask';render()}},c.ms+150);return c}
const flVis=c=>c.kind==='dice'?diceSVG(c.n,130):tenFrames(c.n);
function startFlashG(){S.FG={round:1,stars:[],cur:null,tok:gtoken()};S.FG.cur=flRound(1);go('flash')}
function vFlashG(){const G=S.FG,c=G.cur;if(G.end)return endCard('flash',G.stars.reduce((a,b)=>a+b,0),8,'עיניים של נשר!','לוח עשר: שורה מלאה היא 5, לוח מלא הוא 10. ככה רואים בלי לספור.',G.rec);
  const ex=c.kind==='dice'?'כמו בקובייה – זוכרים את הצורה בלי לספור.':c.n>10?`לוח מלא הוא 10, ועוד ${c.n-10}: ${eq(`10 + ${c.n-10} = ${c.n}`)}`:c.n===10?'לוח מלא – 10!':c.n>5?`שורה מלאה היא 5, ועוד ${c.n-5}: ${eq(`5 + ${c.n-5} = ${c.n}`)}`:`${c.n} – בלי לספור אחד-אחד!`;
  let body;if(c.phase==='show')body=`<div class="vis flashvis">${flVis(c)}</div><div class="gmsg">הסתכלו טוב...</div>`;
  else if(c.phase==='ask')body=`<div class="vis flashvis"><div class="cover">?</div></div><div class="choices">${c.ch.map((v,k)=>`<button class="choice${c.bad.includes(k)?' bad':''}" data-act="flpick" data-k="${k}" ${c.bad.includes(k)?'disabled':''}>${v}</button>`).join('')}</div>`;
  else body=`<div class="vis flashvis">${flVis(c)}</div><div class="fb ${c.ok?'good':''}">${mascot(c.ok?'happy':'calm')}<div class="body"><h3>${c.ok?'נכון!':`היו ${c.n}`}</h3><p>${ex}</p><div><button class="btn" data-act="flnext">${G.round<8||S.TM?'עוד אחד':'לסיכום'}</button></div></div></div>`;
  return `${gStarsHead(G,8,'הצצה')}<div class="qcard"><div class="prompt">${c.phase==='show'?'הסתכלו מהר!':'כמה היו?'}</div>${body}</div>`}
function flpick(k){const G=S.FG,c=G.cur;if(c.phase!=='ask')return;if(c.ch[k]===c.n){c.ok=c.bad.length===0;G.stars.push(c.ok?1:0);if(c.ok){tpt(1);sfx.good()}else sfx.soft();c.phase='res'}else{c.bad.push(k);sfx.bad();if(c.bad.length>=2){c.ok=false;G.stars.push(0);c.phase='res'}}render()}

/* number train – grade א */
function trRound(r){const t=r<=5?r:R(1,5);let nums,dir='up',txt='העמיסו את הקרונות מהקטן לגדול';
  if(t===1){const s=R(1,14);nums=[...Array(6)].map((_,k)=>s+k)}
  else if(t===2){do nums=[...new Set([...Array(14)].map(()=>R(1,20)))].slice(0,6);while(nums.length<6)}
  else if(t===3){dir='down';txt='הפעם הפוך: מהגדול לקטן';const s=R(6,20);nums=[...Array(6)].map((_,k)=>s-k)}
  else if(t===4){txt='בקפיצות של 2, מהקטן לגדול';const s=2*R(0,4);nums=[...Array(6)].map((_,k)=>s+2*k)}
  else{txt='בקפיצות של 10, מהקטן לגדול';const s=10*R(0,4);nums=[...Array(6)].map((_,k)=>s+10*k)}
  const order=nums.slice().sort((a,b)=>dir==='up'?a-b:b-a);return{order,pool:shuffle(nums.slice()),loaded:[],dir,txt,mist:0,msg:'',mcls:'',bad:null,done:false}}
function startTrainG(){S.RG={round:1,stars:[],cur:trRound(1),tok:gtoken()};go('train')}
function vTrainG(){const G=S.RG,c=G.cur;if(G.end)return endCard('train',G.stars.reduce((a,b)=>a+b,0),15,'נהגת רכבת מצוינת!','כל מספר בא אחרי המספר הקטן ממנו – כמו מדרגות.',G.rec);
  const eng=`<svg class="engine" viewBox="0 0 70 60" aria-hidden="true"><rect x="4" y="22" width="56" height="28" rx="6" style="fill:#E5463B"/><rect x="30" y="6" width="24" height="20" rx="4" style="fill:#E5463B"/><rect x="34" y="10" width="16" height="11" rx="2" style="fill:#BFE0FA"/><rect x="8" y="12" width="9" height="12" style="fill:#5A4300"/><circle cx="18" cy="52" r="7" style="fill:var(--ink)"/><circle cx="46" cy="52" r="7" style="fill:var(--ink)"/></svg>`;
  return `${gStarsHead(G,5,'רכבת')}<div class="qcard"><div class="prompt">${c.txt}</div><div class="track"><div class="trainrow${c.done?' go':''}" dir="ltr">${eng}${c.order.map((_,k)=>`<span class="car${k<c.loaded.length?' full':''}">${k<c.loaded.length?c.loaded[k]:''}</span>`).join('')}</div></div>
  <div class="tiles">${c.pool.map(v=>`<button class="tile${c.loaded.includes(v)?' used':''}${c.bad===v?' badt':''}" data-act="trtap" data-v="${v}" ${c.loaded.includes(v)||c.done?'disabled':''}>${v}</button>`).join('')}</div>
  <div class="gmsg ${c.mcls}" aria-live="polite">${c.msg}</div>${c.done?`<div class="row" style="justify-content:center">${starRow(c.st)}<button class="btn" data-act="trnext">${G.round<5||S.TM?'לרכבת הבאה':'לסיכום'}</button></div>`:''}</div>`}
function trtap(v){const G=S.RG,c=G.cur;if(c.done)return;const exp=c.order[c.loaded.length];
  if(v===exp){c.loaded.push(v);c.bad=null;tpt(1);sfx.good();c.msg='';if(c.loaded.length===c.order.length){c.done=true;c.st=c.mist===0?3:c.mist<=2?2:1;G.stars.push(c.st);c.msg=`${c.loaded.join(', ')} – טו-טו! הרכבת יוצאת!`;c.mcls='ok';if(c.st===3)confetti()}}
  else{c.mist++;c.bad=v;sfx.bad();c.mcls='no';const left=c.order.slice(c.loaded.length);c.msg=c.dir==='up'?`${v} גדול מדי. מחפשים את המספר הכי קטן שנשאר${c.loaded.length?` (אחרי ${c.loaded[c.loaded.length-1]})`:''}.`:`${v} קטן מדי. מחפשים את המספר הכי גדול שנשאר${c.loaded.length?` (אחרי ${c.loaded[c.loaded.length-1]})`:''}.`;if(c.mist>=4)c.msg+=` רמז: ${left[0]}.`}
  render()}

/* hungry croc – grade א */
function crRound(r){const lv=r<=4?0:r<=7?1:2;let A,B,As,Bs;if(lv<2){const m=lv?20:10;A=R(1,m);B=Math.random()<.15?A:R(1,m);As=String(A);Bs=String(B)}
  else{const x=R(2,9),y=R(1,10-x);A=x+y;As=`${x} + ${y}`;B=Math.random()<.3?A:Math.max(1,A+pick([1,-1,2,-2]));Bs=String(B);if(Math.random()<.5){[A,B]=[B,A];[As,Bs]=[Bs,As]}}
  return{A,B,As,Bs,lv,ans:A>B?'L':A<B?'R':'E',picked:null}}
function startCrocG(){S.KG={round:1,stars:[],cur:crRound(1),tok:gtoken()};go('croc')}
function vCrocG(){const G=S.KG,c=G.cur;if(G.end)return endCard('croc',G.stars.reduce((a,b)=>a+b,0),10,'התנין שבע!','הפה של התנין תמיד פתוח אל המספר הגדול.',G.rec);
  const sym=c.A>c.B?'>':c.A<c.B?'<':'=';const plate=(s,v,side)=>`<button class="plate${c.picked&&c.ans===side?' right':''}${c.picked===side&&c.ans!==side?' wrong':''}" data-act="crpick" data-id="${side}" ${c.picked?'disabled':''}><b>${s}</b>${c.lv===0?tenFrames(v,0,true):''}</button>`;
  return `${gStarsHead(G,10,'ארוחה')}<div class="qcard"><div class="prompt">איפה יש יותר? לחצו על הצד שהתנין יאכל</div><div class="plates" dir="ltr">${plate(c.As,c.A,'L')}<div class="crocmid">${c.picked?croc(sym,96):'<span style="font-size:40px">?</span>'}</div>${plate(c.Bs,c.B,'R')}</div>
  <div class="row" style="justify-content:center"><button class="btn ghost small${c.picked&&c.ans==='E'?' rightb':''}" data-act="crpick" data-id="E" ${c.picked?'disabled':''}>שווים</button></div>
  ${c.picked?`<div class="fb ${c.picked===c.ans?'good':''}">${mascot(c.picked===c.ans?'happy':'calm')}<div class="body"><h3>${c.picked===c.ans?'נכון!':'לא הפעם'}</h3><p>${c.As!==String(c.A)||c.Bs!==String(c.B)?`קודם מחשבים: ${c.As!==String(c.A)?eq(`${c.As} = ${c.A}`):eq(`${c.Bs} = ${c.B}`)}. `:''}${eq(`${c.A} ${sym} ${c.B}`)}${sym==='='?' – שווים, התנין סוגר את הפה.':' – התנין פונה אל המספר הגדול.'}</p><div><button class="btn" data-act="crnext">${G.round<10||S.TM?'הבא':'לסיכום'}</button></div></div></div>`:''}</div>`}

function spRound(r){const kind=r%3===0?'change':'pay';let it,price;do{it=pick(ITEMS);price=R(it[1],it[2])}while((S.gg==='b'&&price>40)||price<6);
  if(kind==='pay')return{kind,it:it[0],price,tray:[],mist:0,msg:'',mcls:'',done:false};

function vShopG(){const G=S.PG,c=G.cur;if(G.end)return endCard('shop',G.stars.reduce((a,b)=>a+b,0),18,'סוחרת מומחית!','עודף מחשבים בהשלמה: מהמחיר קופצים עד הסכום ששילמנו.',G.rec);
  const tag=`<div class="ptag"><span>${c.it}</span><b>${c.price} ₪</b></div>`;let body;
  if(c.kind==='pay'){const sum=c.tray.reduce((a,b)=>a+b,0);
    body=`<div class="prompt" style="font-size:20px">שלמו <b>בדיוק</b> ${c.price} שקלים</div>${tag}<div class="tray" aria-label="הארנק">${c.tray.length?c.tray.map((v,k)=>`<button class="coinb" data-act="sprem" data-k="${k}" ${c.done?'disabled':''} aria-label="להוריד ${v}">${coinSVG(v,44)}</button>`).join(''):'<span class="traye">לחצו על מטבעות כדי לשלם</span>'}</div><div class="paysum">שילמתם: ${sum} ₪</div>
    ${c.done?'':`<div class="coins">${coinSet().slice().reverse().map(v=>`<button class="coinb" data-act="spadd" data-v="${v}" aria-label="${v} שקלים">${coinSVG(v,54)}</button>`).join('')}</div>`}`}
  else body=`<div class="prompt" style="font-size:20px">קניתם ${c.it} ב-${c.price} ₪ ושילמתם ${c.paid} ₪. כמה עודף תקבלו?</div>${tag}<div class="coins" style="pointer-events:none">${coinSVG(c.paid,54)}</div>${c.done?'':`<div class="choices">${c.choices.map((v,k)=>`<button class="choice${c.bad.includes(k)?' bad':''}" data-act="spch" data-k="${k}" ${c.bad.includes(k)?'disabled':''}>${v} ₪</button>`).join('')}</div>`}`;
  return `${gStarsHead(G,6,'קנייה')}<div class="qcard">${body}<div class="gmsg ${c.mcls}" aria-live="polite">${c.msg}</div>${c.done?`<div class="row" style="justify-content:center">${starRow(c.st)}<button class="btn" data-act="spnext">${G.round<6||S.TM?'לקנייה הבאה':'לסיכום'}</button></div>`:''}</div>`}
function changeLines(price,paid){const L=[];let cur=price;const nt=Math.ceil(price/10)*10;if(nt>cur&&nt<=paid){L.push(`${cur} + ${nt-cur} = ${nt}`);cur=nt}if(paid>cur)L.push(`${cur} + ${paid-cur} = ${paid}`);return L}
function spadd(v){const G=S.PG,c=G.cur;if(c.done)return;c.tray.push(v);sfx.tick();const sum=c.tray.reduce((a,b)=>a+b,0);
  if(sum===c.price){c.done=true;const m=minCoins(c.price);c.st=c.mist?1:c.tray.length<=m.length?3:2;G.stars.push(c.st);tpt(c.st);sfx.good();c.mcls='ok';c.msg=`שילמתם בדיוק ${c.price} ₪ ב-${c.tray.length} מטבעות.${c.tray.length>m.length?` אפשר גם ב-${m.length} בלבד: ${m.join(' + ')}.`:' הכי מעט מטבעות שאפשר – כל הכבוד!'}`;if(c.st===3)confetti()}
  else if(sum>c.price){c.mist++;sfx.bad();c.mcls='no';c.msg=`שילמתם ${sum} – זה יותר מ-${c.price}. לחצו על מטבע בארנק כדי להוריד אותו.`}
  else{c.mcls='';c.msg=`חסרים עוד ${c.price-sum} ₪.`}render()}
function sprem(k){const c=S.PG.cur;if(c.done)return;c.tray.splice(k,1);const sum=c.tray.reduce((a,b)=>a+b,0);c.msg=sum<c.price?`חסרים עוד ${c.price-sum} ₪.`:'';c.mcls='';sfx.tick();render()}
function spch(k){const G=S.PG,c=G.cur;if(c.done)return;const steps0=changeLines(c.price,c.paid);
  if(c.choices[k]===c.ch){c.done=true;c.st=c.mist?1:3;G.stars.push(c.st);tpt(c.st);sfx.good();c.mcls='ok';c.msg=`נכון! סופרים מ-${c.price} עד ${c.paid}: ${steps0.map(x=>eq(x)).join(' ← ')}. העודף: ${c.ch} ₪.`;if(c.st===3)confetti()}
  else{c.mist++;c.bad.push(k);sfx.bad();c.mcls='no';c.msg=`לא בדיוק. משלימים מהמחיר עד הסכום ששילמתם: מ-${c.price}, כמה עד ${steps0.length>1?Math.ceil(c.price/10)*10:c.paid}?`;if(c.mist>=2){c.done=true;c.st=1;G.stars.push(1);tpt(1);c.mcls='';c.msg=`העודף הוא ${c.ch} ₪: ${steps0.map(x=>eq(x)).join(' ← ')}.`}}
  render()}

/* secret number – grades ב-ג */
function scRound(){const max=S.gg==='c'?200:100;return{max,n:R(1,max),lo:1,hi:max,buf:'',guesses:[],done:false,msg:'',mcls:''}}
function startSecretG(){S.QG={round:1,stars:[],cur:scRound(),tok:gtoken()};go('secret')}
function vSecretG(){const G=S.QG,c=G.cur;if(G.end)return endCard('secret',G.stars.reduce((a,b)=>a+b,0),9,'בלשית המספרים!','הטריק: לנחש באמצע הטווח. ככה כל ניחוש מוריד חצי מהאפשרויות.',G.rec);
  const X=v=>((v-1)/(c.max-1)*100).toFixed(2);
  const bar=`<div class="rbar" dir="ltr"><div class="rseg" style="left:${X(c.lo)}%;width:${Math.max(1,X(c.hi)-X(c.lo))}%"></div>${c.guesses.map(g=>`<span class="rg${g===c.n?' hitg':''}" style="left:${X(g)}%">${g}</span>`).join('')}<span class="rend" style="left:0">1</span><span class="rend" style="left:100%">${c.max}</span></div>`;
  const clue=c.guesses.length>=3&&!c.done?`<p class="clue">רמז: ${c.n<10?'זה מספר חד-ספרתי':`ספרת העשרות היא ${Math.floor(c.n/10)%10}`}${c.guesses.length>=5?`, והמספר ${c.n%2?'אי-זוגי':'זוגי'}`:''}.</p>`:'';
  return `${gStarsHead(G,3,'סוד')}<div class="qcard"><div class="prompt" style="font-size:20px">חשבתי על מספר בין 1 ל-${c.max}. ${c.done?'':`הוא בין <b>${c.lo}</b> ל-<b>${c.hi}</b>.`}</div>${bar}${clue}
  <div class="guessbox" dir="ltr">${c.done?c.n:(c.buf||'?')}</div>
  ${c.done?'':`<div class="keypad" dir="ltr">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="sckey" data-id="${n}">${n}</button>`).join('')}<button data-act="sckey" data-id="del" aria-label="מחיקה">⌫</button><button data-act="sckey" data-id="0">0</button><button class="go" data-act="scgo">ניחוש</button></div>`}
  <div class="gmsg ${c.mcls}" aria-live="polite">${c.msg}</div>${c.done?`<div class="row" style="justify-content:center">${starRow(c.st)}<button class="btn" data-act="scnext">${G.round<3||S.TM?'למספר הבא':'לסיכום'}</button></div>`:''}</div>`}
function sckey(k){const c=S.QG.cur;if(c.done)return;if(k==='del')c.buf=c.buf.slice(0,-1);else if(c.buf.length<3)c.buf=(c.buf+k).replace(/^0+/,'');sfx.tick();render()}
function scgo(){const G=S.QG,c=G.cur;if(c.done)return;const g=+c.buf;c.buf='';if(!g||g>c.max){c.msg=`מקלידים מספר בין 1 ל-${c.max}.`;c.mcls='no';render();return}
  c.guesses.push(g);const mid=Math.floor((c.lo+c.hi)/2);
  if(g===c.n){c.done=true;const n=c.guesses.length,lim=c.max>100?8:7;c.st=n<=lim?3:n<=lim+3?2:1;G.stars.push(c.st);tpt(c.st);sfx.good();c.mcls='ok';c.msg=`מצאת! ${c.n} – ב-${n} ניחושים.`;if(c.st===3)confetti()}
  else{sfx.bad();c.mcls='no';const tip=(g<c.lo||g>c.hi)?' (כבר ידענו שזה לא שם!)':'';if(g<c.n){c.lo=Math.max(c.lo,g+1);c.msg=`${g} קטן מדי ▲ המספר גדול יותר.${tip}`}else{c.hi=Math.min(c.hi,g-1);c.msg=`${g} גדול מדי ▼ המספר קטן יותר.${tip}`}
    if(c.guesses.length===2)c.msg+=` טיפ: נחשו באמצע, בערך ${Math.floor((c.lo+c.hi)/2)}.`}
  render()}

  const ps=[...Array(120)].map(()=>({x:W/2+(Math.random()-.5)*120,y:H*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(cols)}));let f=0;
  (function loop(){c.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);c.restore()});if(++f<110)requestAnimationFrame(loop);else c.clearRect(0,0,W,H)})()}

const PRAISE=['מעולה!','כל הכבוד!','נכון מאוד!','איזו חשיבה!','בול!','אלופים!'];
const labelOf=(q,v)=>q.render?q.render(v):v;
function vQuiz(){const Q=S.Q,q=Q.q;
  const segs=[...Array(8)].map((_,k)=>`<i class="${k<Q.results.length?(Q.results[k]?'ok':'no'):k===Q.i?'cur':''}"></i>`).join('');
  const ch=q.multi?multiChoices(Q,q):q.choices.map((v,k)=>{let cls='';if(Q.picked.includes(k)&&v!==q.answer)cls='bad';if(Q.done&&v===q.answer)cls='good';const isTxt=q.small||(typeof v==='string'&&!q.render);return `<button class="choice ${cls}${isTxt?' txt':''}${q.sent?' sentc':''}" data-act="pick" data-k="${k}" ${Q.done||cls?'disabled':''}>${labelOf(q,v)}${cls==='good'&&Q.ok?`<span class="spark">${starSVG(true)}</span>`:''}</button>`}).join('');
  const[,tp]=findTopic(S.topic);
  const cheer=Q.done?(Q.ok?(Q.streak>=3?`רצף של ${Q.streak}! אתם בוערים!`:'יש! ממשיכים במסע.'):'לא נורא! עכשיו כבר יודעים איך.'):Q.wrongs?'חשבו שוב, אני סומך עליכם.':Q.cheer;
  let fb='';
  if(!Q.done&&Q.wrongs>0)fb=`<div class="fb bad" role="status">${mascot('think')}<div class="body"><h3>כמעט! נסו שוב</h3><div>${q.multi&&Q.mmsg?`<p><b>${Q.mmsg}</b></p>`:''}${q.hint}</div></div></div>`;
  else if(Q.done){const lastQ=Q.i===7;const nxt=`<div><button class="btn" data-act="next">${lastQ?'לתוצאות':'לשאלה הבאה'}</button></div>`;
    if(Q.ok)fb=`<div class="fb good" role="status">${mascot('happy')}<div class="body"><h3>${Q.praise}</h3><details><summary>איך חושבים על זה?</summary><div class="explain">${q.explain}</div></details>${nxt}</div></div>`;
    else if(!Q.revealed)fb=`<div class="fb good" role="status">${mascot('happy')}<div class="body"><h3>נכון! הצלחת בניסיון השני</h3><div class="explain">${q.explain}</div>${nxt}</div></div>`;
    else fb=`<div class="fb" role="status">${mascot('calm')}<div class="body"><h3>${q.multi?'הנה התשובה הנכונה':`התשובה היא ${labelOf(q,q.answer)}`}</h3><div class="explain">${q.explain}</div>${ruleCard(tp)}${nxt}</div></div>`}
  return `<div class="buddy">${mascot(Q.done&&!Q.ok?'calm':Q.wrongs&&!Q.done?'think':'happy')}<div class="bubble" aria-live="polite">${cheer}</div></div><div class="qhead"><div class="segs" aria-label="שאלה ${Q.i+1} מתוך 8">${segs}</div>${Q.streak>=2?`<span class="streak">רצף ${Q.streak}!</span>`:''}</div>
  <div class="qcard"><div class="prompt">${q.prompt}</div>${q.visual?`<div class="vis">${q.visual}</div>`:''}<div class="qtools">${canSpeak?`<button class="btn ghost small" data-act="sayq">${'הקראה'}</button>`:''}${!Q.done&&Q.wrongs===0?`<button class="btn ghost small" data-act="hint">${Q.showHint?'הסתרת רמז':'רמז'}</button>`:''}</div>${Q.showHint&&!Q.done&&Q.wrongs===0?`<div class="hintbox">${q.hint}</div>`:''}</div>
  <div class="choices${q.multi?' multi':''}${q.sent?' one':''}">${ch}</div>${q.multi&&!Q.done?`<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" data-act="mcheck" ${Q.msel.length?'':'disabled'}>בדיקה</button></div>`:''}${fb}`}
function multiChoices(Q,q){return q.choices.map((v,k)=>{const sel=Q.msel.includes(k),isC=q.correctSet.includes(v);let cls='';if(Q.done){if(isC)cls='good';else if(sel)cls='bad'}else if(sel)cls='msel';return `<button class="choice mch ${cls}" data-act="mtog" data-k="${k}" aria-pressed="${sel}" ${Q.done?'disabled':''}>${labelOf(q,v)}</button>`}).join('')}
function mcheck(){const Q=S.Q,q=Q.q;if(Q.done)return;const ch=Q.msel.map(k=>q.choices[k]);const ok=ch.length===q.correctSet.length&&ch.every(v=>q.correctSet.includes(v));
  if(ok){Q.done=true;Q.ok=Q.wrongs===0;Q.results.push(Q.ok);if(Q.ok){Q.streak++;Q.praise=pick(PRAISE);sfx.good();if(Q.streak===5)award('streak5')}else{Q.streak=0;Q.missed.push(q);sfx.soft()}}
  else{Q.wrongs++;sfx.bad();Q.showHint=false;const miss=q.correctSet.filter(v=>!ch.includes(v)).length,extra=ch.filter(v=>!q.correctSet.includes(v)).length;Q.mmsg=[extra?`סימנתם ${extra===1?'אחד':extra} שלא ${extra===1?'מתאים':'מתאימים'}.`:'',miss?`${miss===1?'חסר עוד אחד':`חסרים עוד ${miss}`}.`:''].filter(Boolean).join(' ');if(Q.wrongs>1){Q.done=true;Q.ok=false;Q.revealed=true;Q.results.push(false);Q.missed.push(q);Q.streak=0}}
  render()}

function reviewLine(q){if(q.review)return q.review;let t=strip(q.prompt);if(/=\s*\?$/.test(t))return t.replace(/\?$/,String(q.answer));return t+' ← '+q.answer}
function vResult(){const R2=S.R;const[g,t]=findTopic(S.topic);const msg=['כל התחלה קשה. בואו נעבור על השיעור ונתרגל שוב!','התחלה טובה! עוד תרגול קטן ותצליחו יותר.','יפה מאוד! אתם כבר כמעט שם.','מושלם! שלטתם בנושא הזה.'][R2.stars];

  ${R2.missed.length?`<div class="review"><h3>כדאי לזכור</h3><ul>${R2.missed.map(q=>`<li dir="auto">${reviewLine(q)}</li>`).join('')}</ul></div>`:''}</section>`}

  const ch=q.choices.map((v,k)=>{let cls='';if(C.flash){if(v===q.answer)cls='good';else if(k===C.flash.k)cls='bad'}const isTxt=q.small||(typeof v==='string'&&!q.render);return `<button class="choice ${cls}${isTxt?' txt':''}" data-act="cpick" data-k="${k}" ${C.flash?'disabled':''}>${labelOf(q,v)}</button>`}).join('');

/* ---------- quiz engine ---------- */
function newQ(gen,i,seen){let q,t=0;do{q=gen(i);t++}while(seen.has(strip(q.prompt)+q.answer)&&t<8);seen.add(strip(q.prompt)+q.answer);return q}
function startQuiz(id){const[g,t]=findTopic(id);const seen=new Set();S.Q={i:0,seen,cheer:`בואו נתחיל! זכרו: ${t.rule}`,q:newQ(t.gen,0,seen),picked:[],msel:[],mmsg:'',wrongs:0,done:false,ok:false,revealed:false,showHint:false,results:[],missed:[],streak:0};go('quiz',{grade:g.id,topic:id})}
function pick_(k){const Q=S.Q,q=Q.q;if(Q.done||Q.picked.includes(k))return;Q.picked.push(k);const v=q.choices[k];
  if(v===q.answer){Q.done=true;Q.ok=Q.wrongs===0;Q.results.push(Q.ok);if(Q.ok){Q.streak++;Q.praise=pick(PRAISE);sfx.good();if(Q.streak===5)award('streak5')}else{Q.streak=0;Q.missed.push(q);sfx.soft()}}
  else{Q.wrongs++;sfx.bad();Q.showHint=false;const allow=q.choices.length>2?1:0;if(Q.wrongs>allow){Q.done=true;Q.ok=false;Q.revealed=true;Q.results.push(false);Q.missed.push(q);Q.streak=0}}
  render()}
function nextQ(){const Q=S.Q;const[,t]=findTopic(S.topic);if(Q.i>=7){const correct=Q.results.filter(Boolean).length;const stars=correct>=7?3:correct>=5?2:correct>=3?1:0;const unlock=stars>=2&&!unlocked(S.topic);if(stars>(cur().stars[S.topic]||0)){cur().stars[S.topic]=stars;save()}S.R={correct,stars,missed:Q.missed,unlock};go('result');dayRec().quiz++;save();award('first_quiz');if(correct===8)award('perfect');if(S.topic==='c13'&&correct===8)award('review');if(stars===3)award('three');checkAll();checkMission();if(stars>=2)sfx.win();if(stars===3)confetti();return}
  Q.i++;Q.cheer=pick(['אתם יכולים!','קחו את הזמן וחשבו.','צריכים עזרה? יש כפתור רמז.','עוד צעד במסע!','קובי סומך עליכם!',Q.i===7?'שאלה אחרונה, הכי מאתגרת!':'לאט ובטוח.']);Q.q=newQ(t.gen,Q.i,Q.seen);Q.picked=[];Q.msel=[];Q.mmsg='';Q.wrongs=0;Q.done=false;Q.ok=false;Q.revealed=false;Q.showHint=false;render();window.scrollTo({top:0,behavior:'smooth'})}

/* ---------- challenge ---------- */
function cQ(){const g=GR.find(x=>x.id===S.grade);let q;do q=pick(g.topics).gen(R(1,6));while(q.multi||q.sent);return q}
function startChallenge(){S.C={score:0,wrong:0,end:Date.now()+60000,q:cQ(),flash:null};go('challenge');
  timer=setInterval(()=>{const left=Math.max(0,(S.C.end-Date.now())/1000);const b=document.getElementById('tbar'),l=document.getElementById('tleft');if(b)b.style.width=(left/60*100)+'%';if(l)l.textContent=Math.ceil(left);if(left<=0){clearInterval(timer);timer=null;endChallenge()}},200)}
function endChallenge(){const C=S.C;C.record=C.score>(cur().best[S.grade]||0);if(C.record&&C.score>0){cur().best[S.grade]=C.score;save()}go('cresult');if(C.record&&C.score>0){sfx.win();confetti()}gameDone();if(C.score>=15)award('challenge')}
function cpick(k){const C=S.C;if(C.flash)return;const ok=C.q.choices[k]===C.q.answer;if(ok){C.score++;sfx.good()}else{C.wrong++;sfx.bad()}C.flash={k};render();
  setTimeout(()=>{if(S.view!=='challenge')return;C.q=cQ();C.flash=null;render()},ok?380:1100)}

/* ---------- events ---------- */
app.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const a=el.dataset.act,id=el.dataset.id;
  switch(a){

    case 'who':go('who',{grade:null});break;
    case 'home':go('home',{grade:null});break;
    case 'calendar':go('calendar',{calOff:0});break;
    case 'calm':S.calOff=Math.min(0,(S.calOff||0)+(+id));render();break;
    case 'claim':{const wk=keyOf(weekStart());cur().claimed[wk]=true;save();go('surprise');sfx.win();confetti();setTimeout(confetti,900);award('goal');break}

    case 'pin':pinPress(id);break;
    case 'pinforgot':S.pinForgot={a:R(12,19),b:R(6,9)};S.pinMsg='';render();break;
    case 'pinreset':{const v=+(document.getElementById('pf')||{}).value;if(v===S.pinForgot.a*S.pinForgot.b){store.parent.pin=null;save();S.pinForgot=null;S.pinMsg='';render()}else{S.pinMsg='לא נכון, נסו שוב';render()}break}
    case 'pinchange':S.parentOK=false;S.pinChange=true;S.pinBuf='';S.pinMsg='הקלידו קוד חדש';render();break;
    case 'psave':{const m=Math.max(0,Math.min(600,parseInt(document.getElementById('gm-'+id).value)||0));const pz=document.getElementById('gp-'+id).value.trim().slice(0,80);store.parent.goals[id]={min:m,prize:pz};save();render();toast(`<span class="disc" style="--accent:var(--b)">✓</span><span><b>נשמר!</b>${m?`יעד של ${m} דקות בשבוע`:'בלי יעד שבועי'}</span>`);break}
    case 'punclaim':{delete store.profiles[id].claimed[keyOf(weekStart())];save();render();break}
    case 'video':startVideo(id);break;
    case 'vplay':{const V=S.V;if(V.playing){V.playing=false;V.tok++;try{speechSynthesis.cancel()}catch(e){}render()}else{V.playing=true;if(V.ended)V.i=0;playScene()}break}
    case 'vnext':{const V=S.V;if(V.i<V.scenes.length-1){V.i++;try{speechSynthesis.cancel()}catch(e){}playScene()}break}
    case 'vprev':{const V=S.V;if(V.i>0){V.i--;try{speechSynthesis.cancel()}catch(e){}playScene()}break}
    case 'vreplay':{const V=S.V;V.i=0;V.playing=true;playScene();break}
    case 'vnarr':store.narr=store.narr===false;save();render();break;
    case 'games':go('games',{gg:S.gg&&prof().grades.includes(S.gg)?S.gg:prof().grades[prof().grades.length-1]});break;
    case 'gg':go('games',{gg:id});break;
    case 'gstart':S.TM=null;clearInterval(tmInt);({balloons:startBalloons,memory:startMemory,frog:startFrog,tsum:startTS,shapes:startShapesG,clock:startClockG,chart:startChartG,wp:startWPG,bingo:startBingoG,ten:startTenG,flash:startFlashG,train:startTrainG,croc:startCrocG,shop:startShopG,secret:startSecretG})[id]();tmBegin(id);break;
    case 'tmode':cur().tmode=+id;save();render();break;
    case 'bgtap':bgtap(+el.dataset.k);break;
    case 'bgnext':gNext('BG','bingo',1,()=>bgBoard());break;
    case 'tntap':tntap(+el.dataset.k);break;
    case 'tnnext':gNext('TG','ten',3,()=>tnRound());break;
    case 'flpick':flpick(+el.dataset.k);break;
    case 'flnext':gNext('FG','flash',8,flRound);break;
    case 'trtap':trtap(+el.dataset.v);break;
    case 'trnext':gNext('RG','train',5,trRound);break;
    case 'crpick':crpick(id);break;
    case 'crnext':gNext('KG','croc',10,crRound);break;
    case 'spadd':spadd(+el.dataset.v);break;
    case 'sprem':sprem(+el.dataset.k);break;
    case 'spch':spch(+el.dataset.k);break;
    case 'spnext':gNext('PG','shop',6,spRound);break;
    case 'sckey':sckey(id);break;
    case 'scgo':scgo();break;
    case 'scnext':gNext('QG','secret',3,()=>scRound());break;

    case 'mtog':{const Q=S.Q,k=+el.dataset.k,j=Q.msel.indexOf(k);if(j>=0)Q.msel.splice(j,1);else Q.msel.push(k);sfx.tick();render();break}
    case 'mcheck':mcheck();break;
    case 'shtap':shtap(+el.dataset.i);break;
    case 'shnext':gNext('SG','shapes',5,shRound);break;
    case 'ckmove':ckmove(id);break;
    case 'ckcheck':ckcheck();break;
    case 'cknext':gNext('CG','clock',6,ckRound);break;
    case 'chset':chset(+el.dataset.c,+el.dataset.v);break;
    case 'chcheck':chcheck();break;
    case 'chans':chans(+el.dataset.k);break;
    case 'chnext':gNext('HG','chart',4,chRound);break;
    case 'wpchip':wpchip(+el.dataset.v);break;
    case 'wpop':{const c=S.WG.cur;if(c.step===1){c.slots[1]=id;c.msg='';sfx.tick();render()}break}
    case 'wpclear':S.WG.cur.slots=[null,null,null];S.WG.cur.msg='';render();break;
    case 'wpcheck':wpcheck();break;
    case 'wpans':wpans(+el.dataset.k);break;
    case 'wpsent':wpsent(+el.dataset.k);break;
    case 'wpnext':gNext('WG','wp',5,wpRound);break;

    case 'bpop':bpop(+el.dataset.i);break;
    case 'mflip':mflip(+el.dataset.i);break;
    case 'fjump':fjump(+el.dataset.j);break;
    case 'fundo':{const c=S.F.cur;if(c.jumps.length){c.pos-=c.jumps.pop();render()}break}
    case 'fnext':{const F=S.F;if(F.round>=5&&!S.TM){F.end=true;F.rec=setBest('frog',F.stars.reduce((a,b)=>a+b,0));render();if(F.rec){sfx.win();confetti()}gameDone();if(F.stars.reduce((a,b)=>a+b,0)>=12)award('frog');}else{F.round++;F.cur=frogRound();render()}break}
    case 'tpick':tpick(+el.dataset.i);break;
    case 'tclear':S.T.cur.sel=[];S.T.cur.msg='';render();break;
    case 'tmore':{const c=S.T.cur;c.solved=false;c.sel=[];c.msg='איזה עוד קלפים יוצרים את המספר?';c.mcls='';render();break}
    case 'tnext':{const T=S.T;if(T.round>=6&&!S.TM){T.end=true;T.rec=setBest('tsum',T.score);render();if(T.rec){sfx.win();confetti()}gameDone();if(T.score>=8)award('tsum');}else{T.round++;T.cur=tsRound(T.round);render()}break}
    case 'pickuser':store.last=id;save();go('home',{user:id,grade:null});break;
    case 'album':go('album');break;
    case 'play':playOp(el.dataset.op);break;
    case 'sayrule':{const[,t]=findTopic(S.topic);speak(t.rule);break}
    case 'sound':store.sound=!store.sound;save();render();if(store.sound)sfx.tick();break;
    case 'learn':{const[g,t]=findTopic(id);const sl=t.learn();if(t.play)sl.push({play:true});sl.push({rule:true});go('learn',{grade:g.id,topic:id,slides:sl,slide:0,play:null});break}
    case 'nextslide':S.slide++;render();break;
    case 'prev':S.slide--;render();break;
    case 'say':{const s=S.slides[S.slide];speak(s.t+'. '+toSpeech(s.p));break}
    case 'quiz':startQuiz(id);break;
    case 'pick':pick_(+el.dataset.k);break;
    case 'hint':S.Q.showHint=!S.Q.showHint;render();break;
    case 'sayq':{const q=S.Q.q;speak(q.say||toSpeech(q.prompt));break}
    case 'next':nextQ();break;
    case 'challenge':startChallenge();break;
    case 'cpick':cpick(+el.dataset.k);break;
  }});
render();
</script>

</body>
</html>

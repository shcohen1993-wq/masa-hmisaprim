<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>מסע המספרים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Secular+One&display=swap">
<style>
/* Layout: one centered column like a kid's workbook; each grade is a "world" with a dotted path of stations; quiz = big card + chunky tap targets */
:root{
  --bg:#E7EFF6; --paper:#FFFFFF; --soft:#F0F5FA; --ink:#1B2737; --muted:#56677C; --line:#C8D5E2;
  --a:#EC7A1F; --b:#18955C; --c:#6A4CDB; --accent:var(--a); --on-accent:#FFFFFF;
  --good:#1C9A52; --good-bg:#E1F5E8; --bad:#D6404A; --bad-bg:#FCE7E8;
  --dot1:#F0962A; --dot2:#2E7BDB; --sun:#FFBE2E; --x:#A3B0BF; --sky1:#BFE0FA; --sky2:#EEF7FE;
  --f-display:"Secular One","Arial Hebrew",Arial,sans-serif;
  --f-body:"Fredoka","Varela Round","Arial Hebrew",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1726; --paper:#18233A; --soft:#1F2C46; --ink:#E9EFF7; --muted:#9DAAC0; --line:#2C3B58;
  --a:#FF9A4D; --b:#3FCB87; --c:#A28CFF; --on-accent:#0F1726;
  --good:#45CB7D; --good-bg:#16372A; --bad:#FF6B72; --bad-bg:#3B1D24;
  --dot1:#FFAA4A; --dot2:#5DA3FF; --sun:#FFD25E; --x:#56647C; --sky1:#18284A; --sky2:#24375E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1726; --paper:#18233A; --soft:#1F2C46; --ink:#E9EFF7; --muted:#9DAAC0; --line:#2C3B58;
  --a:#FF9A4D; --b:#3FCB87; --c:#A28CFF; --on-accent:#0F1726;
  --good:#45CB7D; --good-bg:#16372A; --bad:#FF6B72; --bad-bg:#3B1D24;
  --dot1:#FFAA4A; --dot2:#5DA3FF; --sun:#FFD25E; --x:#56647C; --sky1:#18284A; --sky2:#24375E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--bg)}
.top .ttl{flex:1;min-width:0;font-family:var(--f-display);font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--paper);border:2px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums}
.chip svg{width:20px;height:20px}

/* buttons */
.btn{font:600 18px var(--f-body);border:0;border-radius:16px;padding:12px 20px;background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 62%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 62%,#000)}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.small{font-size:16px;padding:9px 14px;border-radius:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding-block:18px 22px}
.hero .mascot{width:92px;height:92px}
.hero h1{font-size:clamp(36px,8vw,52px);color:var(--ink)}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);margin-top:4px;max-width:44ch}
.grades{display:grid;gap:16px}
.gcard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:16px;text-align:start;box-shadow:0 5px 0 var(--line);width:100%;transition:transform .12s}
.gcard:hover{transform:translateY(-2px)}
.gletter{width:80px;height:80px;border-radius:22px;background:var(--accent);color:var(--on-accent);font:46px/1 var(--f-display);display:grid;place-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 62%,#000)}
.gcard h2{font-size:26px}
.gcard .world{color:var(--accent);font-weight:600}
.gcard .tag{color:var(--muted);font-size:15px}
.meter{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:6px}
.meter-lab{font-size:13px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.note{margin-top:26px;padding:16px 18px;border-radius:18px;background:var(--soft);color:var(--muted);font-size:15px}
.note b{color:var(--ink)}

/* world */
.worldhead{position:relative;overflow:hidden;background:var(--accent);color:var(--on-accent);border-radius:26px;padding:22px 22px 24px;margin-block:6px 22px}
.worldhead h1{font-size:clamp(30px,7vw,42px)}
.worldhead p{opacity:.92;margin-top:4px;max-width:40ch}
.worldhead .deco{position:absolute;inset-inline-start:auto;inset-inline-end:-6px;top:-18px;font:120px/1 var(--f-display);opacity:.16;letter-spacing:-4px;pointer-events:none;direction:ltr}
.path{display:grid;gap:16px;position:relative}
.path::before{content:"";position:absolute;top:34px;bottom:34px;right:31px;border-right:4px dotted var(--accent);opacity:.45}
.station{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.node{position:relative;z-index:1;width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:30px/1 var(--f-display);display:grid;place-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 62%,#000);border:4px solid var(--bg)}
.node.done{background:var(--sun);color:#3A2A00;box-shadow:0 5px 0 #C08A12}
.scard{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.scard h3{font-size:22px}
.scard p{color:var(--muted);font-size:15px}
.stars{display:inline-flex;gap:3px}
.stars svg{width:22px;height:22px}
.challenge{margin-top:22px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:16px;border-radius:22px;border:3px dashed var(--accent);background:var(--paper)}
.challenge .clock{width:58px;height:58px}
.challenge h3{font-size:22px}
.challenge p{color:var(--muted);font-size:15px}

/* lesson */
.lesson{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:22px 20px;display:grid;gap:16px}
.lesson .eyebrow{font-size:13px;letter-spacing:.06em;color:var(--accent);font-weight:600}
.lesson h2{font-size:28px}
.lesson .txt{font-size:19px;max-width:56ch}
.vis{display:grid;place-items:center;gap:10px;padding:14px;border-radius:18px;background:var(--soft);overflow-x:auto}
.progress-dots{display:flex;gap:6px;justify-content:center}
.progress-dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.progress-dots i.on{background:var(--accent);width:26px;border-radius:6px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}

/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-block:4px 14px;flex-wrap:wrap}
.segs{flex:1;display:flex;gap:5px;min-width:160px}
.segs i{flex:1;height:12px;border-radius:6px;background:var(--line)}
.segs i.ok{background:var(--good)} .segs i.no{background:var(--bad)} .segs i.cur{background:var(--accent)}
.streak{font-weight:600;color:var(--accent);font-size:15px;white-space:nowrap}
.qcard{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:20px;display:grid;gap:14px}
.prompt{font-size:22px;font-weight:600;text-align:center;text-wrap:balance}
.prompt .eq{font-size:44px;display:inline-block;letter-spacing:.02em}
.big-eq{font-size:46px;font-weight:600;text-align:center;direction:ltr}
.slot{display:inline-grid;place-items:center;min-width:1.25em;padding:0 .12em;border:3px dashed var(--accent);border-radius:12px;color:var(--accent);line-height:1.1}
.qtools{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.choice{min-height:78px;font:600 32px var(--f-body);background:var(--paper);border:3px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;font-variant-numeric:tabular-nums;transition:transform .08s}
.choice:active{transform:translateY(3px)}
.choice small{font-size:14px;font-weight:500;color:var(--muted)}
.choice.txt{font-size:24px}
.choice.good{border-color:var(--good);background:var(--good-bg);box-shadow:0 5px 0 var(--good);animation:pop .35s}
.choice.bad{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 5px 0 var(--bad);animation:shake .35s;opacity:.75}
.choice[disabled]{cursor:default}
@keyframes pop{50%{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hintbox{padding:14px;border-radius:16px;background:var(--soft);border:2px dashed var(--line);display:grid;gap:10px;text-align:center}
.fb{display:grid;grid-template-columns:60px 1fr;gap:14px;align-items:start;padding:16px;border-radius:20px;margin-top:16px;background:var(--soft);border:2px solid var(--line)}
.fb.good{background:var(--good-bg);border-color:var(--good)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb .mascot{width:60px;height:60px}
.fb h3{font-size:24px}
.fb .body{display:grid;gap:10px;min-width:0}
.fb details summary{cursor:pointer;font-weight:600;color:var(--accent)}
.fb details[open] summary{margin-bottom:8px}
.explain{display:grid;gap:10px}
.explain .vis{background:var(--paper)}
.alt{font-size:15px;color:var(--muted)}

/* math visuals */
.eq{font-weight:600;white-space:nowrap;unicode-bidi:isolate;direction:ltr;display:inline-block}
.dot{display:inline-block}
.gone{position:relative}
.gone::after{content:"";position:absolute;inset:-4px;background:linear-gradient(135deg,transparent 44%,var(--bad) 44% 56%,transparent 56%)}
.dots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center;max-width:100%}
.dots .gap{width:10px}
.tf-wrap{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tf{display:grid;grid-template-columns:repeat(5,30px);grid-template-rows:repeat(2,30px);border:2.5px solid var(--ink);border-radius:7px;overflow:hidden;background:var(--paper)}
.tf .cell{border:1px solid var(--line);display:grid;place-items:center}
.tf .dot{width:21px;height:21px}
.tf.sm{grid-template-columns:repeat(5,22px);grid-template-rows:repeat(2,22px)}
.tf.sm .dot{width:15px;height:15px}
.cmp{display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap}
.cmp > div{display:grid;gap:6px;justify-items:center}
.cmp b{font-size:22px}
.strip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.strip span{min-width:48px;height:48px;border:2px solid var(--line);border-radius:12px;display:grid;place-items:center;font:600 22px var(--f-body);background:var(--paper);font-variant-numeric:tabular-nums}
.strip .blank{border:3px dashed var(--accent);color:var(--accent)}
.blocks{display:flex;gap:7px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.hund{width:100px;height:100px;background-color:var(--c);background-image:linear-gradient(to bottom,var(--paper) 1px,transparent 1px),linear-gradient(to right,var(--paper) 1px,transparent 1px);background-size:10px 10px;border-radius:3px}
.rod{width:11px;height:100px;background-color:var(--dot2);background-image:linear-gradient(to bottom,var(--paper) 1px,transparent 1px);background-size:100% 10px;border-radius:2px}
.ones{display:grid;grid-template-columns:repeat(2,11px);gap:3px;align-content:end}
.cube{width:11px;height:11px;background:var(--dot1);border-radius:2px}
.blocks .plus{font:600 30px var(--f-body);align-self:center;padding:0 6px}
.groups{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bag{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-content:center;padding:12px;min-width:66px;min-height:66px;max-width:110px;border:3px dashed var(--accent);border-radius:26px;background:var(--paper)}
.bag .dot{width:21px;height:21px}
.arr{display:inline-grid;gap:6px;direction:ltr}
.arr i{width:19px;height:19px}
.pairs{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;direction:ltr}
.pair{display:flex;flex-direction:column;gap:5px;padding:5px;border:2px solid var(--line);border-radius:14px;background:var(--paper)}
.pair .dot{width:22px;height:22px}
.pair.lone{border:2.5px dashed var(--bad)}
.pie path,.pie circle{stroke:var(--ink);stroke-width:2}
.pie .on{fill:var(--accent)} .pie .off{fill:var(--paper)}
.pies{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;align-items:flex-end}
.pies figure{margin:0;display:grid;justify-items:center;gap:6px;font-size:20px}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle;font-weight:600;direction:ltr}
.frac > span:first-child{border-bottom:3px solid currentColor;padding:0 5px 1px}
.nl{width:100%;max-width:600px;height:auto}
.nl .axis{stroke:var(--ink);stroke-width:2.5}
.nl .tick{stroke:var(--ink);stroke-width:2}
.nl .tick.sm{stroke:var(--muted);stroke-width:1.5}
.nl .arc{stroke:var(--accent);fill:none;stroke-width:3;stroke-linecap:round}
.nl .head{fill:var(--accent)}
.nl text{font-family:var(--f-body);text-anchor:middle;fill:var(--muted);font-size:15px}
.nl .tp{fill:var(--ink);font-weight:600;font-size:18px}
.nl .lab{fill:var(--accent);font-weight:600;font-size:17px}
.nl .pt{fill:var(--accent)}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:6px;counter-reset:s}
.steps li{display:flex;align-items:center;gap:10px;counter-increment:s;flex-wrap:wrap}
.steps li::before{content:"שלב " counter(s);font-size:13px;font-weight:600;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:2px 10px}
.steps .eq{font-size:22px}
.pvwrap{overflow-x:auto;max-width:100%}
.pv{border-collapse:collapse;margin:0 auto;font:600 26px var(--f-body);direction:ltr;font-variant-numeric:tabular-nums}
.pv th{font:500 14px var(--f-body);color:var(--muted);padding:2px 12px}
.pv td{text-align:center;padding:2px 16px;border-inline:1.5px solid var(--line);min-width:52px}
.pv td.op{border:0;color:var(--accent);min-width:0;padding:0 6px}
.pv tbody tr:last-child td{border-bottom:3px solid var(--ink)}
.pv tbody tr:last-child td.op{border-bottom:0}
.kw{display:grid;gap:8px}
.kw div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:8px 12px;border-radius:12px;background:var(--paper)}
.kw b{color:var(--accent);min-width:4.5em}

/* mascot */
.mascot .m-body{fill:var(--accent)}
.mascot .m-top{fill:#FFFFFF;opacity:.28}
.mascot .m-eye{fill:#1B2737}
.mascot .m-mouth{fill:none;stroke:#1B2737;stroke-width:3;stroke-linecap:round}
.mascot .m-cheek{fill:#FF6F8E;opacity:.55}
.mascot.happy{animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-5px)}}

/* results */
.result{background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:26px 20px;display:grid;gap:14px;justify-items:center;text-align:center}
.bigstars{display:flex;gap:10px}
.bigstars svg{width:68px;height:68px;animation:starin .5s backwards}
.bigstars svg:nth-child(2){animation-delay:.18s}.bigstars svg:nth-child(3){animation-delay:.36s}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}}
.result h2{font-size:34px}
.result .score{font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums}
.review{width:100%;text-align:start;display:grid;gap:8px;margin-top:6px}
.review h3{font-size:20px}
.review li{padding:8px 12px;border-radius:12px;background:var(--soft);list-style:none}
.review ul{padding:0;margin:0;display:grid;gap:6px}

/* challenge */
.tbar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;flex:1;min-width:120px}
.tbar i{display:block;height:100%;background:var(--accent);border-radius:7px;transition:width .2s linear}
.tleft{font:600 22px var(--f-body);font-variant-numeric:tabular-nums;min-width:3ch;text-align:center}
.cscore{font:28px var(--f-display);color:var(--accent)}

/* themed objects instead of plain dots (icons injected from JS per world) */
.d1{background:var(--i1) center/contain no-repeat} .d2{background:var(--i2) center/contain no-repeat}
.gone{filter:grayscale(1);opacity:.42}
.dot,.arr i{animation:popin .35s backwards;animation-delay:calc(var(--n,0)*30ms)}
@keyframes popin{from{transform:scale(0) rotate(-30deg)}}
.dot{width:28px;height:28px}
.tf .dot{width:24px;height:24px}

/* animated number line */
.nl .arc.anim{stroke-dasharray:1;stroke-dashoffset:1;animation:draw linear forwards}
.nl .head.anim,.nl .lab.anim{opacity:0;animation:fadein .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}

/* world scenes */
.scene{display:block;width:calc(100% + 44px);height:118px;margin:14px -22px -24px}

/* buddy + bubble */
.buddy{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.buddy .mascot{width:54px;height:54px;flex:none}
.bubble{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:8px 14px;font-weight:500;min-width:0}
.bubble::before{content:"";position:absolute;right:-9px;top:50%;width:14px;height:14px;background:var(--paper);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(-45deg)}
.hero .bubble{margin-top:10px;display:inline-block}

/* golden rule */
.rule{background:var(--sun);color:#3A2A00;border-radius:18px;padding:14px 18px;transform:rotate(-1.2deg);box-shadow:0 5px 0 #C9900F;max-width:46ch;justify-self:center;text-align:center}
.rule-lab{display:inline-block;font:13px var(--f-display);letter-spacing:.06em;background:#3A2A00;color:#FFD25E;padding:2px 12px;border-radius:999px;margin-bottom:6px}
.rule p{font:21px/1.45 var(--f-display);text-wrap:balance}

/* stickers */
.disc{width:86px;height:86px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:28px/1 var(--f-display);border:5px solid var(--paper);box-shadow:0 0 0 3px var(--accent),0 7px 0 3px color-mix(in srgb,var(--accent) 55%,#000);transform:rotate(var(--r,0deg));direction:ltr}
.disc.big{width:128px;height:128px;font-size:42px}
.album-sec{display:grid;gap:12px;margin-bottom:26px}
.album-sec h2{font-size:24px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.stk{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px 12px;display:grid;gap:8px;justify-items:center;text-align:center;align-content:start}
.stk b{font-size:16px}
.stk small{font-size:13px;color:var(--muted);line-height:1.4}
.stk.locked .disc{background:var(--soft);color:var(--muted);box-shadow:none;border:3px dashed var(--line)}
.unlock{display:grid;gap:10px;justify-items:center;padding:18px;border-radius:22px;background:var(--soft);width:100%}
.unlock .disc{animation:peel .8s cubic-bezier(.3,1.6,.5,1) backwards .7s}
@keyframes peel{from{transform:scale(0) rotate(-200deg)}}
.albumbtn{display:flex;align-items:center;gap:14px;width:100%;margin-top:16px;padding:14px 16px;border-radius:22px;border:2px solid var(--line);background:var(--paper);box-shadow:0 5px 0 var(--line);text-align:start}
.albumbtn .discs{display:flex;flex:none;padding-inline-start:12px}

.albumbtn h3{font-size:21px}
.albumbtn p{font-size:14px;color:var(--muted)}

/* lab */
.play{display:grid;gap:12px;justify-items:center;width:100%}
.pctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pbig{font:600 46px/1.1 var(--f-body);direction:ltr;font-variant-numeric:tabular-nums}
.pmsg{color:var(--accent);font-weight:600;min-height:1.6em;text-align:center}
.pnum span{display:inline-block}
.pnum .h{color:var(--c)} .pnum .t{color:var(--dot2)} .pnum .o{color:var(--dot1)}
.crocbox{display:grid;place-items:center;min-width:96px}
.lab-tag{font-size:13px;font-weight:600;color:var(--on-accent);background:var(--accent);padding:3px 12px;border-radius:999px}

.choice{position:relative}
.spark{position:absolute;top:-8px;left:50%;width:36px;height:36px;pointer-events:none;animation:fly 1s forwards}
@keyframes fly{0%{opacity:0;transform:translate(-50%,10px) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px) scale(1.25)}}
@media (prefers-reduced-motion:reduce){.nl .arc.anim{stroke-dashoffset:0}.nl .head.anim,.nl .lab.anim{opacity:1}.spark{display:none}}

.whoav{width:84px;height:84px;border-radius:24px;background:var(--soft);display:grid;place-items:center}
.whoav .mascot{width:70px;height:70px}
.gcard.who h2{font-size:30px}

/* games */
.gamesbtn{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;margin-top:16px;padding:18px;border-radius:24px;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 60%,#000);text-align:start;overflow:hidden}
.gamesbtn h3{font-size:28px}
.gamesbtn p{opacity:.92;font-size:15px}
.gamesbtn svg{width:130px;height:80px}
.gtoggle{display:flex;gap:8px;margin-block:4px 16px;flex-wrap:wrap}
.gtoggle button{font:600 16px var(--f-body);padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--paper)}
.gtoggle button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.gamecard{display:grid;gap:8px;background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 5px 0 var(--line);text-align:start;align-content:start}
.gamecard .gill{width:100%;height:112px;border-radius:16px;background:var(--soft);display:block}
.gamecard h3{font-size:23px}
.gamecard p{font-size:15px;color:var(--muted)}
.gamecard .learns{font-size:13px;font-weight:600;color:var(--accent)}
.gamecard .best{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.hearts{display:flex;gap:4px}.hearts svg{width:28px;height:28px}
.gscore{font:26px var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.gq{text-align:center;font:600 42px var(--f-body);margin-bottom:10px}
.stage{position:relative;height:min(60vh,440px);border-radius:24px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));border:2px solid var(--line);touch-action:manipulation}
.stage::after{content:"";position:absolute;inset:auto 0 0;height:26px;background:var(--b);opacity:.55}
.balloon{position:absolute;left:0;top:0;width:var(--bw);height:calc(var(--bw)*1.6);border:0;background:none;padding:0;will-change:transform}
.balloon .bb{display:grid;place-items:center;width:var(--bw);height:calc(var(--bw)*1.14);border-radius:50% 50% 47% 47%/56% 56% 44% 44%;background:var(--bc);color:#fff;font:600 calc(var(--bw)*.36) var(--f-body);box-shadow:inset -7px -9px 0 rgba(0,0,0,.14),inset 7px 7px 0 rgba(255,255,255,.28);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.balloon::after{content:"";position:absolute;left:50%;top:calc(var(--bw)*1.12);width:2px;height:calc(var(--bw)*.48);background:var(--muted)}
.balloon.pop .bb{animation:popb .28s forwards}.balloon.pop::after{opacity:0}
@keyframes popb{to{transform:scale(1.7);opacity:0}}
.balloon.glow .bb{box-shadow:0 0 0 5px var(--sun),0 0 24px 8px var(--sun)}
.gmsg{min-height:3em;text-align:center;font-weight:600;margin-top:10px;font-size:18px}
.fb .eq,.gmsg .eq{white-space:normal}
.gmsg.ok{color:var(--good)} .gmsg.no{color:var(--bad)}
.gover{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);z-index:2;padding:16px}
.gover > div{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:10px;justify-items:center;text-align:center;max-width:340px}
.gover h2{font-size:30px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mcard{aspect-ratio:3/4;max-width:100%;perspective:700px;border:0;background:none;padding:0}
.mcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mcard.flip .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .fc,.mcard .bk{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mcard .bk{background:var(--accent);color:var(--on-accent);font:40px var(--f-display);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.25) 0 8%,transparent 9%),radial-gradient(circle at 80% 75%,rgba(255,255,255,.2) 0 10%,transparent 11%)}
.mcard .fc{background:var(--paper);border:3px solid var(--line);transform:rotateY(180deg);font:600 clamp(16px,4.6vw,24px) var(--f-body);direction:ltr;padding:4px;text-align:center}
.mcard .fc.num{font-size:clamp(26px,8vw,40px);color:var(--accent)}
.mcard.done .fc{border-color:var(--good);background:var(--good-bg)}
.mcard.done{animation:pop .4s}
.fgoal{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:19px;text-align:center}
.fpos{font:600 48px var(--f-body);text-align:center;color:var(--accent);font-variant-numeric:tabular-nums}
.jumps{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.jumps .btn{min-width:84px;font-size:22px;direction:ltr}
.jumps .btn[disabled]{opacity:.35}
.tstar{display:inline-flex;gap:2px}.tstar svg{width:24px;height:24px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:420px;margin:14px auto 0}
.tile{min-height:76px;font:600 34px var(--f-body);border-radius:18px;border:3px solid var(--line);background:var(--paper);box-shadow:0 5px 0 var(--line);font-variant-numeric:tabular-nums;transition:transform .1s}
.tile.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000);transform:translateY(-3px)}
.tile.win{background:var(--good-bg);border-color:var(--good);color:var(--ink);box-shadow:0 5px 0 var(--good)}
.target{display:grid;justify-items:center;gap:2px}
.target b{font:64px/1 var(--f-display);color:var(--accent)}
.sumline{text-align:center;font:600 30px var(--f-body);min-height:1.4em;direction:ltr;margin-top:12px;font-variant-numeric:tabular-nums}
@media (max-width:480px){.mgrid{grid-template-columns:repeat(3,1fr)}.gamesbtn svg{width:90px}.gq{font-size:34px}}

/* motivation */
.drive{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.drive .albumbtn{margin-top:0}
.goalcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px 16px;border-radius:22px;background:var(--paper);border:2px solid var(--line);margin-bottom:14px;width:100%;text-align:start}
.goalcard.ready{border:3px solid var(--sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 35%,transparent);cursor:pointer}
.goalcard h3{font-size:20px}
.goalcard p{font-size:14px;color:var(--muted)}
.gift{width:64px;height:64px}
.goalcard.ready .gift{animation:shakeg 1.2s ease-in-out infinite}
@keyframes shakeg{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-10deg)}80%{transform:rotate(9deg)}90%{transform:rotate(-5deg)}}
.mission{padding:14px 16px;border-radius:22px;background:var(--paper);border:2px solid var(--line);margin-bottom:14px;display:grid;gap:8px}
.mission h3{font-size:20px}
.mission ul{list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.mission li{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--soft);font-size:15px}
.mission li.ok{background:var(--good-bg);color:var(--good);font-weight:600}
.mission li i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;background:var(--paper)}
.mission li.ok i{background:var(--good);border-color:var(--good);color:#fff}
.mission.done{border:3px solid var(--sun)}
#toast{position:fixed;left:0;right:0;margin-inline:auto;width:fit-content;min-width:min(300px,calc(100% - 32px));bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(160%);z-index:30;display:flex;align-items:center;gap:14px;background:var(--paper);color:var(--ink);border:3px solid var(--sun);border-radius:22px;padding:12px 20px 12px 16px;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:transform .45s cubic-bezier(.3,1.5,.5,1);max-width:calc(100% - 32px);direction:rtl;font-family:var(--f-body)}
#toast.show{transform:translateY(0);visibility:visible}
#toast:not(.show){visibility:hidden;transition:transform .45s,visibility 0s .45s}
#toast .disc{width:64px;height:64px;font-size:22px;flex:none}
#toast b{display:block;font:20px var(--f-display);color:var(--accent)}
#toast small{color:var(--muted);font-size:14px}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.calhead h2{font-size:26px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.cal .day{aspect-ratio:1/1.1;border-radius:14px;background:var(--paper);border:2px solid var(--line);display:grid;grid-template-rows:auto 1fr auto;justify-items:center;padding:4px 2px;font-size:13px;font-variant-numeric:tabular-nums;min-width:0}
.cal .day.empty{background:none;border:0}
.cal .day.today{border:3px solid var(--accent)}
.cal .day .stamp{width:min(32px,70%);height:auto;align-self:center}
.cal .day small{font-size:11px;color:var(--muted);white-space:nowrap}
.cal .day.gold{background:color-mix(in srgb,var(--sun) 28%,var(--paper))}
.calstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.stat{padding:12px 14px;border-radius:18px;background:var(--paper);border:2px solid var(--line)}
.stat b{display:block;font:28px var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted);align-items:center}
.legend svg{width:22px;height:22px;vertical-align:middle}
/* video */
.player{background:var(--paper);border:2px solid var(--line);border-radius:26px;overflow:hidden}
.screen{position:relative;min-height:300px;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--accent) 16%,var(--paper)),var(--soft) 70%)}
.screen .scene-in{display:grid;gap:14px;justify-items:center;text-align:center;animation:scenein .7s both;width:100%}
@keyframes scenein{from{opacity:0;transform:translateY(18px) scale(.96)}}
.screen h2{font-size:clamp(28px,6vw,40px)}
.screen .steps li{animation:fadeup .5s backwards;animation-delay:calc(.8s + var(--k,0)*1.3s)}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}}
.screen .bigtitle{font:clamp(34px,8vw,52px)/1.1 var(--f-display);color:var(--accent)}
.vend{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 80%,transparent);z-index:2;padding:16px}
.vend > div{display:grid;gap:12px;justify-items:center;text-align:center;background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:22px}
.presenter{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:14px 16px;border-top:2px solid var(--line)}
.presenter .mascot{width:64px;height:64px}
.caption{font-size:19px;line-height:1.55;min-height:3.1em}
.talking .m-mouth{animation:talk .22s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.5)}}
.vctl{display:flex;align-items:center;gap:10px;padding:10px 16px 16px;flex-wrap:wrap}
.vbar{flex:1;display:flex;gap:4px;min-width:120px}
.vbar i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.vbar i.on{background:var(--accent)}
.vnote{font-size:13px;color:var(--muted);padding:0 16px 14px}
/* parent */
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;direction:ltr}
.pinpad button{height:64px;font:600 26px var(--f-body);border-radius:16px;border:2px solid var(--line);background:var(--paper);box-shadow:0 4px 0 var(--line)}
.pindots{display:flex;gap:12px;justify-content:center;margin:12px 0 18px}
.pindots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--accent)}
.pindots i.on{background:var(--accent)}
.pcard{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:12px;margin-bottom:16px}
.pcard h2{font-size:26px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.field{display:grid;gap:4px}
.field label{font-weight:600;font-size:15px}
.field input{font:500 17px var(--f-body);padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.field small{color:var(--muted);font-size:13px}
.wbars{display:flex;gap:8px;align-items:flex-end;height:90px;direction:ltr}
.wbars div{flex:1;display:grid;gap:4px;justify-items:center;font-size:12px;color:var(--muted);height:100%;align-content:end}
.wbars i{display:block;width:70%;border-radius:6px 6px 0 0;background:var(--accent);min-height:3px}
.parentlink{display:flex;justify-content:center;margin-top:28px}
.surprise{display:grid;justify-items:center;gap:14px;text-align:center;padding:26px 18px;background:var(--paper);border:3px solid var(--sun);border-radius:28px}
.surprise .gift{width:150px;height:150px}
.surprise .lid{animation:lidoff 1s .4s forwards;transform-box:fill-box;transform-origin:center}
@keyframes lidoff{to{transform:translateY(-40px) rotate(-25deg);opacity:0}}
.surprise .prize{font:clamp(26px,6vw,36px)/1.3 var(--f-display);color:var(--accent);animation:scenein .7s 1.1s both}
@media (max-width:480px){.drive{grid-template-columns:1fr}.pinpad{grid-template-columns:repeat(3,64px)}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* worksheet-style additions */
.sechead{position:relative;z-index:1;background:var(--bg);font:20px var(--f-display);color:var(--accent);padding-block:10px 2px;display:flex;align-items:center;gap:10px}
.sechead::after{content:"";flex:1;height:3px;border-radius:2px;background:var(--line)}
.choices.multi{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}

.choice.mch svg{display:block}
.choice.msel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--paper));box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent),0 5px 0 var(--accent)}
.choices.one{grid-template-columns:1fr}
.choice.sentc{font-size:19px;font-weight:500;min-height:58px;line-height:1.4;padding:10px 14px}

.shgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.caxis,.ccol{display:grid;grid-template-rows:repeat(10,26px);gap:2px}
.caxis span{font-size:12px;color:var(--muted);text-align:right;line-height:26px;font-variant-numeric:tabular-nums}
.ccell{border:1.5px solid var(--line);border-radius:5px;background:var(--paper);padding:0}

#tmpts.bump{animation:pop .35s}
.result .mascot{width:92px;height:92px}
.tmhead small{font:600 13px var(--f-body);color:var(--muted)}
.bgrid{display:grid;gap:8px;max-width:420px;margin:14px auto 0}
.bcell{aspect-ratio:1;border-radius:16px;border:3px solid var(--line);background:var(--paper);font:600 clamp(20px,6vw,30px) var(--f-body);box-shadow:0 4px 0 var(--line);font-variant-numeric:tabular-nums;position:relative}
.bcell.hit{background:color-mix(in srgb,var(--accent) 22%,var(--paper));border-color:var(--accent);color:var(--accent)}

.bcell.win{background:var(--sun);border-color:#C9900F;color:#3A2A00}

.tencards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:0 auto 12px}
.tcard{aspect-ratio:3/4;border-radius:16px;border:3px solid var(--line);background:var(--paper);font:600 clamp(28px,8vw,40px) var(--f-body);box-shadow:0 5px 0 var(--line);transition:transform .15s}
.tcard.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--paper));transform:translateY(-6px)}
.tcard.gone{opacity:0;transform:scale(.6);pointer-events:none}
.flashvis{min-height:180px}
.cover{width:150px;height:150px;border-radius:24px;background:var(--accent);color:var(--on-accent);font:80px/150px var(--f-display);text-align:center}
.track{overflow:hidden;border-bottom:5px solid var(--ink);margin-block:8px 16px;padding-top:6px}
.trainrow{display:flex;align-items:flex-end;gap:4px;transition:transform 1.2s ease-in}
.trainrow.go{transform:translateX(110%)}
.engine{width:64px;height:56px;flex:none}
.car{flex:1;min-width:0;max-width:56px;height:44px;border-radius:8px;border:3px dashed var(--line);display:grid;place-items:center;font:600 20px var(--f-body);background:var(--paper)}
.car.full{border:0;background:var(--accent);color:var(--on-accent);animation:pop .3s}
.tile.used{opacity:.3}
.tile.badt{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
.plates{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-block:10px}
.plate{display:grid;gap:8px;justify-items:center;padding:14px 8px;border-radius:22px;border:3px solid var(--line);background:var(--paper);box-shadow:0 5px 0 var(--line);min-width:0}
.plate b{font:600 clamp(26px,8vw,40px) var(--f-body);direction:ltr}
.plate.right{border-color:var(--good);background:var(--good-bg)}
.plate.wrong{border-color:var(--bad);background:var(--bad-bg)}
.crocmid{min-width:70px;display:grid;place-items:center}
.btn.rightb{border-color:var(--good);background:var(--good-bg)}
.ptag{display:flex;justify-content:center;align-items:center;gap:12px;margin:10px auto;padding:10px 18px;border-radius:14px;background:var(--soft);width:fit-content;max-width:100%;font-size:18px}
.ptag b{font:24px var(--f-display);color:var(--accent);direction:ltr}
.tray{min-height:70px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;padding:10px;border-radius:18px;border:3px dashed var(--line);margin-block:6px}
.traye{color:var(--muted);font-size:15px}
.coins{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:10px}
.coinb{border:0;background:none;padding:2px;border-radius:50%;transition:transform .1s}
.coinb:active{transform:scale(.9)}
.paysum{text-align:center;font:600 22px var(--f-body);font-variant-numeric:tabular-nums}
.rbar{position:relative;height:16px;border-radius:8px;background:var(--line);margin:30px 14px 26px}
.rseg{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:8px;transition:left .4s,width .4s}
.rg{position:absolute;top:-26px;transform:translateX(-50%);font-size:13px;font-weight:600;color:var(--muted)}
.rg::after{content:"";position:absolute;left:50%;top:20px;width:2px;height:20px;background:var(--ink)}
.rg.hitg{color:var(--good)}
.rend{position:absolute;top:20px;transform:translateX(-50%);font-size:12px;color:var(--muted)}
.clue{text-align:center;font-weight:600;color:var(--accent)}
.guessbox{margin:6px auto 10px;width:150px;height:64px;border-radius:16px;border:3px solid var(--accent);display:grid;place-items:center;font:600 38px var(--f-body);font-variant-numeric:tabular-nums}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center}
.keypad button{height:56px;font:600 24px var(--f-body);border-radius:14px;border:2px solid var(--line);background:var(--paper);box-shadow:0 4px 0 var(--line)}
.keypad .go{grid-column:1/-1;background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);font-size:20px}
@media (max-width:480px){.tencards{grid-template-columns:repeat(4,1fr);gap:7px}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
@media (max-width:480px){
  .prompt .eq,.big-eq{font-size:36px}
  .choice{min-height:68px;font-size:28px}
  .hero{grid-template-columns:1fr;justify-items:start}
  .gletter{width:64px;height:64px;font-size:38px}
  .gcard h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app" dir="rtl" lang="he"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- helpers ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const D=i=>i<3?0:(i<6?1:2);
const eq=s=>`<span class="eq" dir="ltr">${s}</span>`;
const qEq=s=>eq(s.replace('?','<span class="slot">?</span>'));
const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim()};
function choicesFrom(ans,cands,min=0){const set=new Set([ans]);for(const c of cands){if(set.size>=4)break;if(c>=min&&Number.isInteger(c))set.add(c)}let k=1;while(set.size<4){if(ans+k>=min)set.add(ans+k);if(set.size<4&&ans-k>=min)set.add(ans-k);k++}return shuffle([...set])}
const near=(ans,offs,min=0)=>choicesFrom(ans,shuffle(offs.slice()).map(o=>ans+o),min);
function choicesStr(ans,cands){const set=new Set([ans]);for(const c of cands){if(set.size>=4)break;set.add(c)}return shuffle([...set])}
const steps=list=>`<ol class="steps">${list.map((s,k)=>`<li style="--k:${k}">${eq(s)}</li>`).join('')}</ol>`;
const vis=h=>`<div class="vis">${h}</div>`;

/* ---------- visuals ---------- */
function dotsSeq(classes){let h='<div class="dots" dir="ltr">';classes.forEach((c,i)=>{h+=`<i class="dot ${c}" style="--n:${i}"></i>`;if(i%5===4&&i<classes.length-1)h+='<b class="gap"></b>'});return h+'</div>'}
const twoColor=(a,b)=>dotsSeq([...Array(a).fill('d1'),...Array(b).fill('d2')]);
const crossDots=(n,k)=>dotsSeq([...Array(n-k).fill('d1'),...Array(k).fill('d1 gone')]);
function tenFrames(a,b=0,sm=false){const t=a+b,f=Math.max(1,Math.ceil(t/10));let h='<div class="tf-wrap" dir="ltr">';for(let k=0;k<f;k++){h+=`<div class="tf${sm?' sm':''}">`;for(let i=0;i<10;i++){const x=k*10+i;const c=x<a?'d1':x<t?'d2':'';h+=`<span class="cell">${c?`<i class="dot ${c}" style="--n:${x}"></i>`:''}</span>`}h+='</div>'}return h+'</div>'}
function numberStrip(nums,blank){return `<div class="strip" dir="ltr">${nums.map((n,i)=>i===blank?'<span class="blank">?</span>':`<span>${n}</span>`).join('')}</div>`}
function blocks(h,t,o){let s='<div class="blocks" dir="ltr">';for(let i=0;i<h;i++)s+='<i class="hund"></i>';for(let i=0;i<t;i++)s+='<i class="rod"></i>';if(o)s+=`<span class="ones">${'<i class="cube"></i>'.repeat(o)}</span>`;return s+'</div>'}
function blocksPlus(a,b){return `<div class="blocks" dir="ltr">${blocks(0,a,0).replace(/^<div class="blocks" dir="ltr">|<\/div>$/g,'')}<span class="plus">+</span>${blocks(0,b,0).replace(/^<div class="blocks" dir="ltr">|<\/div>$/g,'')}</div>`}
function groupsVis(g,p){let h='<div class="groups" dir="ltr">';for(let i=0;i<g;i++)h+=`<div class="bag">${[...Array(p)].map((_,j)=>`<i class="dot ${i%2?'d2':'d1'}" style="--n:${i*p+j}"></i>`).join('')}</div>`;return h+'</div>'}
function arrayGrid(r,c){let h=`<div class="arr" style="grid-template-columns:repeat(${c},17px)">`;for(let i=0;i<r;i++)for(let j=0;j<c;j++)h+=`<i class="${i%2?'d2':'d1'}" style="--n:${i*c+j}"></i>`;return h+'</div>'}
function pairs(n){let h='<div class="pairs">';for(let i=0;i<n;i+=2){const lone=i+1>=n;h+=`<span class="pair${lone?' lone':''}"><i class="dot d1"></i>${lone?'':'<i class="dot d2"></i>'}</span>`}return h+'</div>'}
function pie(n,d,s=110){const r=s/2-3,c=s/2;let p='';if(d===1)return `<svg class="pie" viewBox="0 0 ${s} ${s}" width="${s}" height="${s}"><circle cx="${c}" cy="${c}" r="${r}" class="${n?'on':'off'}"/></svg>`;for(let i=0;i<d;i++){const a0=-Math.PI/2+i*2*Math.PI/d,a1=a0+2*Math.PI/d;const x0=c+r*Math.cos(a0),y0=c+r*Math.sin(a0),x1=c+r*Math.cos(a1),y1=c+r*Math.sin(a1);p+=`<path d="M${c},${c} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" class="${i<n?'on':'off'}"/>`}return `<svg class="pie" viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" role="img" aria-label="עיגול מחולק ל-${d} חלקים">${p}</svg>`}
const frac=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const fracS=s=>{const [n,d]=s.split('/');return frac(n,d)};
const FNAME={'1/2':'חצי','1/3':'שליש','2/3':'שני שלישים','1/4':'רבע','2/4':'שני רבעים','3/4':'שלושה רבעים','1/6':'שישית','1/8':'שמינית'};
function pvTable(a,b,op){const row=(n,sign='')=>{const s=String(n).padStart(3,' ');return `<tr><td class="op">${sign}</td>${[...s].map(ch=>`<td>${ch.trim()}</td>`).join('')}</tr>`};return `<div class="pvwrap"><table class="pv"><thead><tr><th></th><th>מאות</th><th>עשרות</th><th>אחדות</th></tr></thead><tbody>${row(a)}${row(b,op)}</tbody></table></div>`}
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const FROG='<ellipse cx="0" cy="4" rx="11" ry="8" fill="#3DBE5C"/><circle cx="-5" cy="-4" r="4.6" fill="#3DBE5C"/><circle cx="5" cy="-4" r="4.6" fill="#3DBE5C"/><circle cx="-5" cy="-4" r="2.7" fill="#fff"/><circle cx="5" cy="-4" r="2.7" fill="#fff"/><circle cx="-4.4" cy="-4" r="1.4" fill="#1B2737"/><circle cx="5.6" cy="-4" r="1.4" fill="#1B2737"/><path d="M-5 6 Q0 10 5 6" stroke="#1B2737" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
function qlen(a,b,m,c,y0){let L=0,px=a,py=y0;for(let s=1;s<=16;s++){const t=s/16,u=1-t;const x=u*u*a+2*u*t*m+t*t*b,y=u*u*y0+2*u*t*c+t*t*y0;L+=Math.hypot(x-px,y-py);px=x;py=y}return L}
function numberLine(start,jumps,animFrom=0,target=null){
  const pts=[start];jumps.forEach(j=>pts.push(pts[pts.length-1]+j));
  const ext=target===null?pts:[...pts,target];let lo=Math.min(...ext),hi=Math.max(...ext);const span=Math.max(hi-lo,1);const unit=span<=20;
  const pad=unit?1:Math.ceil(span*.08);lo=Math.max(0,lo-pad);hi=hi+pad;if(unit&&hi-lo<6)hi=lo+6;
  const x0=26,x1=574,y=104,y0=y-5,X=v=>x0+(v-lo)/(hi-lo)*(x1-x0);
  let s=`<svg class="nl" viewBox="0 0 600 140" role="img" aria-label="ציר מספרים"><line x1="${x0-12}" y1="${y}" x2="${x1+12}" y2="${y}" class="axis"/>`;
  if(unit){for(let v=lo;v<=hi;v++){s+=`<line x1="${X(v)}" y1="${y-6}" x2="${X(v)}" y2="${y+6}" class="tick"/>`;if(!pts.includes(v)&&v!==target)s+=`<text x="${X(v)}" y="${y+26}">${v}</text>`}}
  else{const st=span>150?100:10;for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st)s+=`<line x1="${X(v)}" y1="${y-5}" x2="${X(v)}" y2="${y+5}" class="tick sm"/>`}
  const lab=jumps.length<=3||jumps.some(j=>Math.abs(j)>1);
  const nA=jumps.length-animFrom,per=nA>0?Math.min(.55,3/nA):0,motion=nA>0&&!RM();let d='';const lens=[];
  jumps.forEach((j,k)=>{const a=X(pts[k]),b=X(pts[k+1]),m=(a+b)/2,h=Math.min(68,20+Math.abs(b-a)*.35),c=y0-2*h+10;const an=k>=animFrom,dl=(k-animFrom)*per;
    s+=`<path class="arc${an?' anim':''}" pathLength="1" style="animation-delay:${dl}s;animation-duration:${per}s" d="M${a} ${y0} Q${m} ${c} ${b} ${y0}"/><polygon class="head${an?' anim':''}" style="animation-delay:${dl+per*.85}s" points="${b-6},${y-17} ${b+6},${y-17} ${b},${y-4}"/>`;
    if(lab)s+=`<text class="lab${an?' anim':''}" style="animation-delay:${dl+per*.5}s" x="${m}" y="${(y0+c)/2-8}">${j>0?'+':'−'}${Math.abs(j)}</text>`;
    if(an){d+=(d?'':`M${a} ${y0}`)+` Q${m} ${c} ${b} ${y0}`;lens.push(qlen(a,b,m,c,y0))}});
  if(target!==null){const tx=X(target);s+=`<line x1="${tx}" y1="${y}" x2="${tx}" y2="${y-46}" stroke="#7A4A26" stroke-width="3"/><polygon points="${tx},${y-46} ${tx+20},${y-39} ${tx},${y-32}" fill="#E5463B"/><ellipse cx="${tx}" cy="${y+2}" rx="16" ry="6" fill="#3DBE5C" opacity=".75"/>`;if(!pts.includes(target))s+=`<text class="tp" x="${tx}" y="${y+28}" style="fill:#E5463B">${target}</text>`}
  [...new Set(pts)].forEach(v=>{s+=`<circle class="pt" cx="${X(v)}" cy="${y}" r="5"/><text class="tp" x="${X(v)}" y="${y+28}">${v}</text>`});
  if(motion){const tot=lens.reduce((a,b)=>a+b,0)||1;let acc=0;const kp=['0'],kt=['0'];lens.forEach((l,k)=>{acc+=l;kp.push((acc/tot).toFixed(4));kt.push(((k+1)/lens.length).toFixed(4))});kp[kp.length-1]='1';kt[kt.length-1]='1';
    s+=`<g><g transform="translate(0,-13)">${FROG}</g><animateMotion dur="${(per*nA).toFixed(2)}s" fill="freeze" path="${d}" keyPoints="${kp.join(';')}" keyTimes="${kt.join(';')}" calcMode="linear"/></g>`}
  else s+=`<g transform="translate(${X(pts[pts.length-1])},${y0-13})">${FROG}</g>`;
  return s+'</svg>';
}
function croc(sym,w=104){if(sym==='=')return `<div class="big-eq" style="font-size:58px">=</div>`;
  const teeth=(up)=>[24,38,52,66].map(x=>{const yy=up?13+(x-12)*.216:47-(x-12)*.216;return up?`<polygon points="${x-3},${yy} ${x+3},${yy+1} ${x},${yy+6}" fill="#fff"/>`:`<polygon points="${x-3},${yy} ${x+3},${yy-1} ${x},${yy-6}" fill="#fff"/>`}).join('');
  const g=`<circle cx="86" cy="30" r="13" fill="#2E9150"/><polygon points="92,19 8,4 5,11 12,13 86,29" fill="#3DAA5C"/><polygon points="92,41 8,56 5,49 12,47 86,31" fill="#3DAA5C"/><path d="M12 13 L86 30 L12 47" fill="#C2405A"/>${teeth(1)}${teeth(0)}<circle cx="74" cy="14" r="6" fill="#fff"/><circle cx="72.5" cy="14" r="3" fill="#1B2737"/>`;
  return `<svg viewBox="0 0 100 60" width="${w}" height="${w*.6}" aria-label="${sym==='>'?'גדול מ':'קטן מ'}" role="img">${sym==='>'?g:`<g transform="translate(100,0) scale(-1,1)">${g}</g>`}</svg>`}
function mascot(mood='happy'){const mouth=mood==='happy'?'M19 33 Q28 42 37 33':mood==='think'?'M23 36 Q28 31 33 36':'M21 36 L35 36';return `<svg class="mascot ${mood}" viewBox="0 0 56 56" aria-hidden="true"><rect x="4" y="6" width="48" height="46" rx="13" class="m-body"/><rect x="9" y="9" width="38" height="9" rx="4.5" class="m-top"/><circle cx="20" cy="26" r="4.2" class="m-eye"/><circle cx="36" cy="26" r="4.2" class="m-eye"/><circle cx="21.4" cy="24.6" r="1.4" fill="#fff"/><circle cx="37.4" cy="24.6" r="1.4" fill="#fff"/><path d="${mouth}" class="m-mouth"/><circle cx="12" cy="35" r="3.2" class="m-cheek"/><circle cx="44" cy="35" r="3.2" class="m-cheek"/></svg>`}
const starSVG=on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="${on?'var(--sun)':'var(--line)'}" stroke="${on?'#C9900F':'none'}" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
const starsRow=n=>`<span class="stars" aria-label="${n} מתוך 3 כוכבים">${[0,1,2].map(i=>starSVG(i<n)).join('')}</span>`;

/* ---------- names for word problems ---------- */
const KIDS=[['נועה',1],['איתי',0],['מאיה',1],['יונתן',0],['תמר',1],['אורי',0],['שירה',1],['עומר',0],['הילה',1],['דניאל',0]];

/* ---------- grade א ---------- */
function genCount(i){const d=D(i);
  if(i===2||i===5||i===7){const after=Math.random()<.6;const n=after?R(d?6:1,d===2?19:10):R(d?7:2,d===2?20:10);const ans=after?n+1:n-1;const seq=[];for(let k=ans-2;k<=ans+2;k++)if(k>=0)seq.push(k);
    return{prompt:`איזה מספר בא <b>${after?'אחרי':'לפני'}</b> ${n}?`,visual:numberStrip(seq,seq.indexOf(ans)),answer:ans,choices:near(ans,[1,-1,2,-2,10]),
      hint:after?'כשסופרים קדימה, המספר הבא גדול ב-1.':'כשסופרים אחורה, המספר הקודם קטן ב-1.',
      explain:after?`<p>סופרים קדימה ומוסיפים 1: ${eq(`${n} + 1 = ${ans}`)}</p>`:`<p>סופרים אחורה ומורידים 1: ${eq(`${n} − 1 = ${ans}`)}</p>`,
      review:`${after?'אחרי':'לפני'} ${n} בא ${ans}`}}
  const n=R([3,8,12][d],[9,15,20][d]);
  let ex;if(n>10)ex=`<p>לוח מלא הוא תמיד 10. בלוח השני יש עוד ${n-10}. ${eq(`10 + ${n-10} = ${n}`)}</p>`;else if(n===10)ex='<p>כל הלוח מלא: 2 שורות של 5. זה בדיוק 10.</p>';else if(n>5)ex=`<p>בשורה העליונה 5, בשורה התחתונה עוד ${n-5}. ${eq(`5 + ${n-5} = ${n}`)}</p>`;else ex=`<p>סופרים אחד-אחד: ${[...Array(n)].map((_,k)=>k+1).join(', ')}.</p>`;
  return{prompt:'כמה עיגולים יש בלוחות?',visual:tenFrames(n),answer:n,choices:near(n,[1,-1,2,-2]),hint:'כל שורה בלוח היא 5. לוח שלם הוא 10. אל תספרו אחד-אחד, ספרו בקבוצות!',explain:ex,review:`בלוחות יש ${n} עיגולים`}}
function genAdd10(i){const d=D(i);const sum=R(2,[5,8,10][d]);const a=R(1,sum-1),b=sum-a;const big=Math.max(a,b),sm=Math.min(a,b);const cnt=[];for(let k=1;k<=sm;k++)cnt.push(big+k);
  return{prompt:qEq(`${a} + ${b} = ?`),visual:d<2?twoColor(a,b):'',answer:sum,choices:near(sum,[1,-1,2,-2]),
    hint:`התחילו מהמספר הגדול, ${big}, והמשיכו לספור עוד ${sm}.`+(d===2?vis(twoColor(a,b)):''),
    explain:`<p>מתחילים מהמספר הגדול ${big} וקופצים ${sm} ${sm===1?'צעד':'צעדים'} קדימה: ${cnt.join(', ')}.</p>${vis(numberLine(big,Array(sm).fill(1)))}${sum===10?`<p class="alt">${a} ו-${b} הם "חברים של 10". כדאי לזכור אותם בעל פה!</p>`:''}`}}
function genSub10(i){const d=D(i);const a=R([3,5,6][d],[6,9,10][d]);const b=R(1,d===2?a:a-1);const ans=a-b;

  else if(t===1){const a=R(20,[50,80,150][d]),b=R(5,a-5);ans=a-b;pr=`בדוכן היו ${a} תפוחים. מכרו ${b} תפוחים. כמה תפוחים נשארו בדוכן?`;expr=`${a} − ${b} = ${ans}`;key='נשארו';op='חיסור';know=`היו ${a}, מכרו ${b}`;ask='כמה נשארו'}

  else if(t===3){const k=R(2,[5,6,9][d]),q=R(2,[5,8,9][d]),n=k*q;ans=q;pr=`${n} עוגיות מחלקים שווה בשווה ל-${k} ילדים. כמה עוגיות יקבל כל ילד?`;expr=`${n} ÷ ${k} = ${q}`;key='מחלקים שווה בשווה';op='חילוק';know=`${n} עוגיות, ${k} ילדים`;ask='כמה לכל ילד'}

 <div class="gcards">${GAMES.filter(G=>!G.grades||G.grades.includes(S.gg)).sort((x,y)=>(y.grades?1:0)-(x.grades?1:0)).map(G=>{const b=gbest(G.id);const how=G.id==='tsum'&&S.gg==='c'?'מצאו שני מספרים שהכפל שלהם יוצא בדיוק המספר המבוקש.':G.how;return `<div class="gamecard">${gameIll(G.id)}<h3>${G.title}</h3><p>${how}</p><span class="learns">מה לומדים: ${G.learns}</span><span class="best">${b!==undefined?G.best(b):'עוד לא שיחקתם'}</span>${cur().tmode&&tmBest(G.id,cur().tmode)!==undefined?`<span class="tbest">שיא ב${tmLabel(cur().tmode)}: ${tmBest(G.id,cur().tmode)} נקודות</span>`:''}<div><button class="btn" data-act="gstart" data-id="${G.id}">${cur().tmode?'משחקים נגד השעון!':'משחקים!'}</button></div></div>`}).join('')}</div>`}

/* balloons */
const BCOL=['#E5463B','#2E7BDB','#F0962A','#8A6CF0','#1C9A52','#E0499B'];
function startBalloons(){S.B={score:0,lives:3,level:1,ok:0,objs:[],msg:'',mcls:'',over:false,tok:gtoken()};go('balloons');newBRound()}
function newBRound(){const B=S.B;const st=document.getElementById('stage');if(!st)return;const W=st.clientWidth,H=st.clientHeight;
 B.q=gq(S.gg);B.wait=false;B.missed=false;const n=S.gg==='a'?4:5;let vals=choicesFrom(B.q.a,shuffle([1,-1,2,-2,10,-10,3]).map(o=>B.q.a+o));while(vals.length<n){const v=B.q.a+R(3,7);if(!vals.includes(v))vals.push(v)}vals=shuffle(vals.slice(0,n));if(!vals.includes(B.q.a))vals[0]=B.q.a;
 const lw=W/n;B.bw=Math.max(48,Math.min(78,lw-8));const cols=shuffle(BCOL.slice());
 B.objs=vals.map((v,i)=>({val:v,x:i*lw+(lw-B.bw)/2,y:H+R(10,170),v:({a:32,b:40,c:46})[S.gg]+B.level*7+R(0,12),c:cols[i%cols.length],popped:false,glow:false}));
 document.getElementById('bq').innerHTML=qEq(B.q.t);mountB();if(!raf){lastT=0;raf=requestAnimationFrame(loopB)}}
function mountB(){const B=S.B,st=document.getElementById('stage');if(!st)return;
 st.innerHTML=B.objs.map((o,i)=>`<button class="balloon${o.popped?' pop':''}${o.glow?' glow':''}" data-act="bpop" data-i="${i}" style="--bc:${o.c};--bw:${B.bw}px;transform:translate(${o.x}px,${o.y}px)" aria-label="${o.val}"><span class="bb">${o.val}</span></button>`).join('')+(B.over?`<div class="gover"><div>${mascot('happy')}<h2>${B.rec?'שיא חדש!':'כל הכבוד!'}</h2><p>פוצצתם ${B.score} בלונים נכונים</p><p style="color:var(--muted)">השיא: ${gbest('balloons')||0}</p><div class="row" style="justify-content:center"><button class="btn ghost" data-act="games">לכל המשחקים</button><button class="btn" data-act="gstart" data-id="balloons">עוד פעם</button></div></div></div>`:'');
 [...st.querySelectorAll('.balloon')].forEach((el,i)=>B.objs[i].el=el)}
function loopB(t){const B=S.B;if(S.view!=='balloons'||!B||B.over){raf=null;return}const dt=lastT?Math.min(.05,(t-lastT)/1000):0;lastT=t;
 B.objs.forEach(o=>{if(o.popped)return;o.y-=o.v*dt;if(o.el)o.el.style.transform=`translate(${o.x}px,${o.y}px)`});
 const ans=B.objs.find(o=>o.val===B.q.a);if(!B.wait&&ans&&!ans.popped&&ans.y<-B.bw*1.7){B.wait=true;bMsg(`הבלון ברח! ${solvedEq(B.q)}`,'no');sfx.bad();if(!B.missed&&!S.TM)B.lives--;bAfter(1500)}
 raf=requestAnimationFrame(loopB)}
function bMsg(h,c){const B=S.B;B.msg=h;B.mcls=c;const m=document.getElementById('bmsg');if(m){m.innerHTML=h;m.className='gmsg '+c}const hh=document.getElementById('bhead');if(hh)hh.innerHTML=bHead()}
function bAfter(ms){const B=S.B,tok=B.tok;setTimeout(()=>{if(S.view!=='balloons'||S.B.tok!==tok)return;if(B.lives<=0){B.over=true;B.rec=setBest('balloons',B.score);mountB();if(B.rec&&B.score>0){sfx.win();confetti()}gameDone();if(B.score>=10)award('balloons')}else newBRound()},ms)}
function bHead(){const B=S.B;return `${S.TM?'':`<span class="hearts" aria-label="${B.lives} חיים">${[0,1,2].map(i=>heart(i<B.lives)).join('')}</span>`}<span>שלב ${B.level}</span><span class="gscore">${B.score}</span>`}
function bpop(i){const B=S.B,o=B.objs[i];if(!o||o.popped||B.wait||B.over)return;o.popped=true;o.el&&o.el.classList.add('pop');
 if(o.val===B.q.a){B.wait=true;if(!B.missed){B.score++;tpt(1);B.ok++;if(B.ok%4===0)B.level++;sfx.good();bMsg(`יש! ${solvedEq(B.q)}`,'ok')}else{sfx.soft();bMsg(`נכון! ${solvedEq(B.q)}`,'ok')}bAfter(700)}
 else{sfx.bad();B.missed=true;if(!S.TM)B.lives--;const a=B.objs.find(x=>x.val===B.q.a);if(a){a.glow=true;a.el&&a.el.classList.add('glow')}bMsg(`${o.val} לא מתאים. ${solvedEq(B.q)} – פוצצו את הבלון הזוהר!`,'no');if(B.lives<=0){B.wait=true;bAfter(1300)}}}
function vBalloons(){const B=S.B;return `<div class="ghead" id="bhead">${bHead()}</div><div class="gq" id="bq">${B.q?qEq(B.q.t):''}</div><div class="stage" id="stage"></div><div class="gmsg ${B.mcls}" id="bmsg" aria-live="polite">${B.msg||'פוצצו את הבלון עם התשובה הנכונה!'}</div>`}

/* memory */
function startMemory(){const qs=[],ans=new Set();let g=0;while(qs.length<6&&g<200){g++;const q=gq(S.gg);if(ans.has(q.a))continue;ans.add(q.a);qs.push(q)}
 const cards=shuffle(qs.flatMap((q,i)=>[{p:i,kind:'ex',label:q.t.includes('? =')?q.t:q.t.replace(' = ?',''),q},{p:i,kind:'num',label:String(q.a),q}]));
 S.M={cards,open:[],done:new Set(),moves:0,lock:false,msg:'מצאו זוג: תרגיל והתשובה שלו.',mcls:'',tok:gtoken()};go('memory')}
function vMemory(){const M=S.M;const fin=M.done.size===6;const st=M.moves<=8?3:M.moves<=11?2:1;
 return `<div class="ghead"><span>זוגות: ${M.done.size} מתוך 6</span><span class="gscore">${M.moves} צעדים</span></div>
 <div class="mgrid">${M.cards.map((c,i)=>`<button class="mcard${M.open.includes(i)?' flip':''}${M.done.has(c.p)?' done':''}" data-act="mflip" data-i="${i}" aria-label="קלף ${i+1}"><span class="in"><span class="bk">?</span><span class="fc${c.kind==='num'?' num':''}">${c.label}</span></span></button>`).join('')}</div>
 <div class="gmsg ${M.mcls}" id="mmsg" aria-live="polite">${M.msg}</div>
 ${fin?`<div class="result" style="margin-top:12px">${mascot('happy')}<div class="bigstars">${[0,1,2].map(i=>starSVG(i<st)).join('')}</div><h2>${M.rec?'שיא חדש!':'מצאתם את כל הזוגות!'}</h2><p class="score">${M.moves} צעדים · השיא: ${gbest('memory')}</p><div class="row" style="justify-content:center"><button class="btn ghost" data-act="games">לכל המשחקים</button><button class="btn" data-act="gstart" data-id="memory">עוד פעם</button></div></div>`:''}`}
function mflip(i){const M=S.M;if(M.lock||M.open.includes(i)||M.done.has(M.cards[i].p))return;M.open.push(i);document.querySelector(`[data-act="mflip"][data-i="${i}"]`).classList.add('flip');sfx.tick();
 if(M.open.length<2)return;M.moves++;const [a,b]=M.open.map(k=>M.cards[k]);const msg=document.getElementById('mmsg');
 if(a.p===b.p){M.done.add(a.p);tpt(1);M.open=[];M.msg=`זוג! ${solvedEq(a.q)}`;M.mcls='ok';sfx.good();if(M.done.size===6&&S.TM){render();setTimeout(()=>{if(S.view==='memory'&&S.TM&&!S.TM.over)startMemory()},700);return}if(M.done.size===6){M.rec=setBest('memory',M.moves,true);gameDone();if(M.moves<=9)award('memory');setTimeout(()=>{if(S.view==='memory'){render();sfx.win();if(M.moves<=8)confetti()}},500)}else render();return}
 M.lock=true;sfx.bad();
 if(a.kind===b.kind)M.msg=a.kind==='num'?'שני מספרים – צריך זוג של תרגיל ותשובה.':'שני תרגילים – צריך זוג של תרגיל ותשובה.';
 else{const ex=a.kind==='ex'?a:b,nu=a.kind==='ex'?b:a;M.msg=`לא זוג: ${solvedEq(ex.q)}, ולא ${nu.label}. זכרו איפה הם!`}
 M.mcls='no';if(msg){msg.innerHTML=M.msg;msg.className='gmsg no'}const tok=M.tok;
 setTimeout(()=>{if(S.view!=='memory'||S.M.tok!==tok)return;M.open=[];M.lock=false;render()},1300)}

/* frog */
const FJ={a:{max:20,j:[1,2,5,-1]},b:{max:100,j:[1,5,10,-1,-10]},c:{max:999,j:[5,10,50,100,-1,-10,-100]}};
function bfs(s,t,J,max){const prev=new Map([[s,null]]);const q=[s];let h=0;while(h<q.length){const v=q[h++];if(v===t)break;for(const j of J){const w=v+j;if(w<0||w>max||prev.has(w))continue;prev.set(w,[v,j]);q.push(w)}}const path=[];let v=t;while(prev.get(v)){const[pv,j]=prev.get(v);path.unshift(j);v=pv}return path}
function frogRound(){const gr=S.gg,c=FJ[gr];let s0,t0;
 if(gr==='a'){s0=R(0,8);t0=Math.random()<.25&&s0>=6?R(0,s0-4):R(s0+4,20)}
 else if(gr==='b'){s0=R(5,60);t0=Math.random()<.3&&s0>30?s0-R(14,28):Math.min(100,s0+R(14,39))}
 else{s0=10*R(5,50);t0=Math.random()<.3&&s0>300?s0-10*R(11,25)-pick([0,5]):Math.min(995,s0+10*R(11,48)+pick([0,5]))}
 const opt=bfs(s0,t0,c.j,c.max);return{start:s0,target:t0,pos:s0,jumps:[],opt,done:false}}
function startFrog(){S.F={round:1,stars:[],cur:frogRound(),tok:gtoken()};go('frog')}
const pathEq=(s0,js)=>`${s0}${js.map(j=>` ${j>0?'+':'−'} ${Math.abs(j)}`).join('')} = ${js.reduce((a,b)=>a+b,s0)}`;
function vFrog(){const F=S.F,c=F.cur,J=FJ[S.gg];const total=F.stars.reduce((a,b)=>a+b,0);
 if(F.end)return `<div class="result">${mascot('happy')}<h2>${F.rec?'שיא חדש!':'הצפרדע הגיעה הביתה!'}</h2><div class="bigstars">${[0,1,2].map(i=>starSVG(i<Math.round(total/5))).join('')}</div><p class="score">${total} כוכבים מתוך 15 · השיא: ${gbest('frog')}</p><p>הסוד: קודם קפיצות גדולות, ואז קטנות. ולפעמים קופצים קצת יותר מדי וחוזרים אחורה!</p><div class="row" style="justify-content:center"><button class="btn ghost" data-act="games">לכל המשחקים</button><button class="btn" data-act="gstart" data-id="frog">עוד פעם</button></div></div>`;
 const n=c.jumps.length,st=n<=c.opt.length?3:n<=c.opt.length+1?2:1;
 let fb='';if(c.done){fb=`<div class="fb good">${mascot('happy')}<div class="body"><h3>${st===3?'בדיוק בדרך הכי קצרה!':'הגעתם!'} <span class="tstar">${[0,1,2].map(i=>starSVG(i<st)).join('')}</span></h3><p>הדרך שלכם: ${eq(pathEq(c.start,c.jumps))}</p>${st<3?`<p>הדרך הכי קצרה (${c.opt.length} קפיצות): ${eq(pathEq(c.start,c.opt))}</p>`:''}<div><button class="btn" data-act="fnext">${F.round<5?'לעלה הבא':'לסיכום'}</button></div></div></div>`}
 else if(n>=c.opt.length+3)fb=`<div class="fb">${mascot('think')}<div class="body"><p>טיפ: כמה רחוק העלה? ${eq(`${c.target} − ${c.pos} = ${c.target-c.pos}`)}. התחילו בקפיצות הגדולות.</p></div></div>`;
 return `<div class="ghead"><span>עלה ${F.round}${S.TM?'':' מתוך 5'}</span><span class="tstar">${starSVG(true)}<b class="gscore" style="font-size:22px">${total}</b></span></div>
 <div class="qcard"><div class="fgoal"><span>הצפרדע ב-<b>${c.start}</b> ורוצה להגיע לדגל <b style="color:#E5463B">${c.target}</b>.</span><span class="chip">אפשר ב-${c.opt.length} קפיצות</span></div>
 <div class="vis">${numberLine(c.start,c.jumps,Math.max(0,n-1),c.target)}</div><div class="fpos" dir="ltr">${c.pos}</div>
 ${c.done?'':`<div class="jumps" dir="ltr">${J.j.slice().sort((a,b)=>a-b).map(j=>`<button class="btn${j<0?' ghost':''}" data-act="fjump" data-j="${j}" ${c.pos+j<0||c.pos+j>J.max?'disabled':''}>${j>0?'+':'−'}${Math.abs(j)}</button>`).join('')}</div><div class="row" style="justify-content:center;margin-top:10px">${n?'<button class="btn ghost small" data-act="fundo">ביטול קפיצה</button>':''}</div>`}</div>${fb}`}
function fjump(j){const c=S.F.cur;if(c.done)return;c.jumps.push(j);c.pos+=j;if(c.jumps.length>14){c.start+=c.jumps.shift()}
 if(c.pos===c.target){c.done=true;const n=c.jumps.length,st=n<=c.opt.length?3:n<=c.opt.length+1?2:1;S.F.stars.push(st);tpt(st);sfx.good();if(st===3)confetti()}else sfx.tick();render()}

/* build-the-number */
function tsRound(round){const gr=S.gg;let tiles,target,mode='sum';
 if(gr==='c'){mode='prod';const a=R(2,9),b=R(2,9);target=a*b;tiles=a===b?[a,b]:[a,b];while(tiles.length<6){const v=R(2,12);if(!tiles.includes(v)||tiles.filter(x=>x===v).length<1)tiles.push(v)}}
 else{const pool=gr==='a'?[1,2,3,4,5,6,7,8,9]:[5,10,15,20,25,30,35,40,45,50];const k=round<3?2:3;let ch;do{ch=shuffle(pool.slice()).slice(0,k);target=ch.reduce((x,y)=>x+y,0)}while(target>(gr==='a'?18:100));
  tiles=ch.slice();for(const v of shuffle(pool.slice())){if(tiles.length>=6)break;if(!tiles.includes(v))tiles.push(v)}}
 tiles=shuffle(tiles);const sols=new Set();for(let m=1;m<64;m++){const idx=[0,1,2,3,4,5].filter(i=>m>>i&1);if(idx.length<2)continue;if(mode==='prod'&&idx.length!==2)continue;const vals=idx.map(i=>tiles[i]);const v=mode==='prod'?vals[0]*vals[1]:vals.reduce((x,y)=>x+y,0);if(v===target)sols.add(vals.slice().sort((x,y)=>x-y).join(','))}
 return{tiles,target,mode,sel:[],found:[],total:sols.size,solved:false,msg:''}}
function startTS(){S.T={round:1,score:0,cur:tsRound(1),tok:gtoken()};go('tsum')}
function vTS(){const T=S.T,c=T.cur;
 if(T.end)return `<div class="result">${mascot('happy')}<h2>${T.rec?'שיא חדש!':'בנאים אמיתיים!'}</h2><p class="score">מצאתם ${T.score} פתרונות · השיא: ${gbest('tsum')}</p><p>זכרו: לכל מספר יש הרבה דרכים להרכיב אותו.</p><div class="row" style="justify-content:center"><button class="btn ghost" data-act="games">לכל המשחקים</button><button class="btn" data-act="gstart" data-id="tsum">עוד פעם</button></div></div>`;
 const vals=c.sel.map(i=>c.tiles[i]);const op=c.mode==='prod'?' × ':' + ';const cur=c.mode==='prod'?(vals.length?vals.reduce((a,b)=>a*b,1):0):vals.reduce((a,b)=>a+b,0);
 const line=vals.length?`${vals.join(op)} = ${cur}`:'';
 return `<div class="ghead"><span>סיבוב ${T.round}${S.TM?'':' מתוך 6'}</span><span class="gscore">${T.score}</span></div>
 <div class="qcard"><div class="target"><span>${c.mode==='prod'?'בחרו 2 מספרים שהכפל שלהם':'בחרו מספרים שהסכום שלהם'}</span><b>${c.target}</b></div>
 <div class="tiles">${c.tiles.map((v,i)=>`<button class="tile${c.sel.includes(i)?(c.solved?' win':' sel'):''}" data-act="tpick" data-i="${i}" ${c.solved?'disabled':''}>${v}</button>`).join('')}</div>
 <div class="sumline">${line}</div><div class="gmsg ${c.mcls||''}" aria-live="polite">${c.msg||(c.mode==='prod'?'לחצו על שני קלפים.':'לחצו על קלפים כדי לחבר אותם.')}</div>
 <div class="row" style="justify-content:center">${c.solved?`${c.found.length<c.total?'<button class="btn ghost" data-act="tmore">אחפש עוד דרך</button>':''}<button class="btn" data-act="tnext">${T.round<6?'לסיבוב הבא':'לסיכום'}</button>`:(c.sel.length?'<button class="btn ghost small" data-act="tclear">ניקוי</button>':'')}</div></div>`}
function tpick(i){const c=S.T.cur;if(c.solved)return;const k=c.sel.indexOf(i);if(k>=0)c.sel.splice(k,1);else c.sel.push(i);sfx.tick();c.msg='';c.mcls='';
 const vals=c.sel.map(x=>c.tiles[x]);
 if(c.mode==='prod'){if(vals.length===2){const p=vals[0]*vals[1];if(p===c.target)tsWin(vals);else{c.msg=`${vals[0]} × ${vals[1]} = ${p}, ${p<c.target?'קטן':'גדול'} מ-${c.target}. נסו זוג אחר.`;c.mcls='no';sfx.bad();const tok=S.T.tok;setTimeout(()=>{if(S.view==='tsum'&&S.T.tok===tok&&!c.solved){c.sel=[];render()}},1300)}}}
 else{const sum=vals.reduce((a,b)=>a+b,0);if(sum===c.target&&vals.length>=2)tsWin(vals);else if(sum===c.target){c.msg='זה המספר עצמו! צריך לבנות אותו משני קלפים לפחות.';c.mcls='no'}else if(sum>c.target){c.msg=`עברנו את ה-${c.target} ב-${sum-c.target}. הורידו קלף.`;c.mcls='no'}else if(vals.length)c.msg=`חסר עוד ${c.target-sum}.`}
 render()}
function tsWin(vals){const c=S.T.cur;const key=vals.slice().sort((a,b)=>a-b).join(',');if(c.found.includes(key)){c.msg='את הדרך הזאת כבר מצאתם. נסו קלפים אחרים!';c.mcls='no';c.sel=[];return}
 c.found.push(key);c.solved=true;S.T.score++;tpt(1);sfx.good();const rest=c.total-c.found.length;c.msg=`מצוין! ${vals.join(c.mode==='prod'?' × ':' + ')} = ${c.target}`+(rest?` · יש עוד ${rest===1?'דרך אחת':rest+' דרכים'}!`:'');c.mcls='ok';if(rest===0&&c.total>1)confetti()}

const pad2=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayKey=()=>keyOf(new Date());
function dayRec(pid,k){const c=pid?store.profiles[pid]:cur();k=k||todayKey();return c.days[k]=c.days[k]||{sec:0,quiz:0,game:0}}
const played=d=>d&&(d.sec>=60||d.quiz>0||d.game>0);
function weekStart(d=new Date()){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x}
function weekSec(pid,offset=0){const c=store.profiles[pid];const st=weekStart();st.setDate(st.getDate()-7*offset);let t=0;for(let i=0;i<7;i++){const d=new Date(st);d.setDate(st.getDate()+i);const r=c.days[keyOf(d)];if(r)t+=r.sec}return t}
function streak(pid){const c=store.profiles[pid];const d=new Date();if(!played(c.days[keyOf(d)]))d.setDate(d.getDate()-1);let n=0;while(played(c.days[keyOf(d)])){n++;d.setDate(d.getDate()-1)}return n}
function bestStreak(pid){const ks=Object.keys(store.profiles[pid].days).filter(k=>played(store.profiles[pid].days[k])).sort();let best=0,run=0,prev=null;ks.forEach(k=>{const d=new Date(k+'T12:00');if(prev&&Math.round((d-prev)/864e5)===1)run++;else run=1;best=Math.max(best,run);prev=d});return best}
const totalSec=pid=>Object.values(store.profiles[pid].days).reduce((a,d)=>a+(d.sec||0),0);
const mins=sec=>Math.floor(sec/60);

  if(op==='+'){let c=0;for(let p=0;p<3&&(p<L||c);p++){const s=da[p]+db[p]+c;const ex=eq(`${da[p]} + ${db[p]}${c?' + 1':''} = ${s}`);if(s>=10&&p<2){lines.push(`<b>${P[p]}:</b> ${ex} – כותבים ${s-10}, ו-10 ${P[p]} הופכות ל${P1[p+1]} אחת שעוברת לטור ה${P[p+1]}.`);c=1}else{lines.push(`<b>${P[p]}:</b> ${ex}`);c=0}}}

  if(t==='ruler0'){const n=R(3,9);return{prompt:'מה אורך הקטע?',visual:rulerSVG(0,n,10),answer:n,choices:near(n,[1,-1,2],1),render:UNIT,hint:'הקטע מתחיל ב-0 של הסרגל. איפה הוא נגמר?',explain:`<p>הקטע מתחיל ב-0 ונגמר ב-${n}, ולכן אורכו <b>${n} ס״מ</b>.</p>`,review:`הקטע: ${n} ס״מ`}}
  if(t==='rulerAB'){const a=R(1,4),b=a+R(3,6),L=b-a;return{prompt:'מה אורך הקטע?',visual:rulerSVG(a,b,10),answer:L,choices:choicesFrom(L,[b,L+1,L-1,a+b],1),render:UNIT,hint:'שימו לב: הקטע לא מתחיל ב-0! איפה הוא מתחיל ואיפה הוא נגמר?',
    explain:`<p>הקטע מתחיל ב-${a} ונגמר ב-${b}. האורך הוא המרחק ביניהם:</p><p>${eq(`${b} − ${a} = ${L}`)}</p>${vis(numberLine(a,[L]))}<p class="alt">טעות נפוצה: לענות ${b}, כי שם הקטע נגמר. אבל הוא לא התחיל ב-0!</p>`,review:`קטע מ-${a} עד ${b}: ${L} ס״מ`}}
  if(t==='rect'){const w=R(3,d?9:6),h=R(2,w-1),P=2*(w+h);return{prompt:`למלבן צלעות באורך ${w} ס״מ ו-${h} ס״מ. מה ההיקף שלו?`,visual:rectSVG(w,h),answer:P,choices:choicesFrom(P,[w+h,w*h,P+2,P-2],1),render:UNIT,hint:`היקף = כל הדרך מסביב. למלבן 4 צלעות: 2 באורך ${w} ו-2 באורך ${h}.`,
    explain:`${vis(rectSVG(w,h,{all:true}))}${steps([`${w} + ${h} + ${w} + ${h} = ${P}`])}<p class="alt">טעות נפוצה: לחבר רק שתי צלעות (${w+h}). למלבן יש 4 צלעות!</p>`,review:`היקף מלבן ${w} על ${h}: ${P} ס״מ`}}
  if(t==='square'){const a=R(3,9),P=4*a;if(d===2&&Math.random()<.4)return{prompt:`ההיקף של ריבוע הוא ${P} ס״מ. מה אורך הצלע שלו?`,visual:'',answer:a,choices:near(a,[1,-1,2,4],1),render:UNIT,hint:'לריבוע 4 צלעות שוות. מחלקים את ההיקף ל-4.',explain:`<p>לריבוע 4 צלעות שוות, אז מחלקים את ההיקף ל-4: ${eq(`${P} ÷ 4 = ${a}`)}</p><p class="alt">בודקים: ${eq(`${a} + ${a} + ${a} + ${a} = ${P}`)}</p>`,review:`צלע הריבוע: ${a} ס״מ`};

  let a,b,c;do{a=R(3,9);b=R(3,9);c=R(3,9)}while(a>=b+c||b>=a+c||c>=a+b);const P=a+b+c;
  return{prompt:`למשולש צלעות באורך ${a}, ${b} ו-${c} ס״מ. מה ההיקף שלו?`,visual:triSVG(a,b,c),answer:P,choices:choicesFrom(P,[a+b,P+1,P-1,P+10],1),render:UNIT,hint:'מחברים את כל 3 הצלעות.',explain:`${steps([`${a} + ${b} + ${c} = ${P}`])}<p class="alt">היקף = כל הצלעות ביחד. למשולש יש 3.</p>`,review:`היקף המשולש: ${P} ס״מ`}}

function genSeq(i){const d=D(i);const t=['seq','line','cmp','seq','multi','line','cmp','seq'][i]||pick(['seq','line','cmp']);
  if(t==='seq'){const step=pick(d===0?[10,5,2]:d===1?[5,2,3,10]:[25,50,100,4]);const up=Math.random()<(d===0?.6:.5);const len=6,maxV=d===2?1000:100,span=step*(len-1);
    const s0=[10,5,25,50,100].includes(step)?step*R(0,Math.floor((maxV-span)/step)):R(0,maxV-span);let nums=[...Array(len)].map((_,k)=>s0+k*step);if(!up)nums.reverse();
    const blank=d===0?R(2,len-1):pick([0,len-1,R(1,len-2)]);const ans=nums[blank];const sg=up?'+':'−';
    const how=blank>0?eq(`${nums[blank-1]} ${sg} ${step} = ${ans}`):eq(`${nums[1]} ${up?'−':'+'} ${step} = ${ans}`);
    return{prompt:'השלימו את המספר החסר בסדרה:',visual:numberStrip(nums,blank),answer:ans,choices:near(ans,[step,-step,1,-1,10]),hint:'בדקו כמה עולים או יורדים בכל צעד, בין שני מספרים שכנים.',
      explain:`<p>בכל צעד ${up?'מוסיפים':'מורידים'} ${step}${blank===0?'. המספר החסר בהתחלה, אז הולכים צעד אחד אחורה':''}:</p><p>${how}</p>`,review:`${nums.join(', ')}`}}
  if(t==='line'){const step=d===0?10:d===1?pick([5,2]):pick([100,50,25]);const n=d===0?5:6;const lo=d===0?0:step*R(0,d===2?3:8);const miss=R(1,n-1),ans=lo+miss*step;
    return{prompt:'השלימו את המספר החסר על ציר המספרים:',visual:tickLine(lo,step,n,miss),answer:ans,choices:near(ans,[step,-step,10,1,-1]),hint:'כמה עולה הציר מקו לקו? בדקו בין שני מספרים שכנים.',
      explain:`<p>המרחק בין כל שני קווים הוא ${step}: ${eq(`${lo+step} − ${lo} = ${step}`)}</p><p>לכן ${eq(`${ans-step} + ${step} = ${ans}`)}</p>`,review:`על הציר: ${ans}`}}
  if(t==='cmp'){let Ls,Lv,Rs,Rv;
    if(d===0){Lv=R(21,98);if(Lv%10===Math.floor(Lv/10))Lv++;Ls=String(Lv);Rv=Number(String(Lv).split('').reverse().join(''));if(Rv<10||Rv===Lv)Rv=Lv+pick([1,-1,10]);if(Math.random()<.25)Rv=Lv;Rs=String(Rv)}
    else{const x=10*R(2,8),y=R(1,9);Rv=x+y;Rs=`${x} + ${y}`;const r=Math.random();Lv=r<.4?Rv:Rv+pick([1,-1,10,-10]);
      if(d===2){const p=Lv+R(5,25);Ls=`${p} − ${p-Lv}`}else Ls=String(Lv)}
    const ans=Lv>Rv?'>':Lv<Rv?'<':'=';
    return{prompt:`איזה סימן מתאים?<div class="big-eq">${Ls} <span class="slot">?</span> ${Rs}</div>`,say:`מה גדול יותר?`,visual:'',answer:ans,choices:['>','<','='],render:v=>`<span dir="ltr">${v}</span><small>${{'>':'גדול מ','<':'קטן מ','=':'שווה ל'}[v]}</small>`,hint:'קודם מחשבים את התרגיל, ורק אחר כך משווים.',
      explain:`${Rs.includes(' ')||Ls.includes(' ')?`<p>קודם מחשבים: ${Rs.includes(' ')?eq(`${Rs} = ${Rv}`):''} ${Ls.includes(' ')?eq(`${Ls} = ${Lv}`):''}</p>`:''}<div class="cmp" dir="ltr"><b style="font-size:36px">${Lv}</b><div class="crocbox">${croc(ans,90)}</div><b style="font-size:36px">${Rv}</b></div><p>ולכן ${eq(`${Ls} ${ans} ${Rs}`)}</p>`,review:`${Ls} ${ans} ${Rs}`}}
  const ev=Math.random()<.6;let nums;do{nums=[...new Set([...Array(10)].map(()=>R(d===2?100:10,d===2?999:99)))].slice(0,8)}while(nums.length<8||nums.filter(n=>(n%2===0)===ev).length<2||nums.filter(n=>(n%2===0)===ev).length>5);
  const cs=nums.filter(n=>(n%2===0)===ev);const w=ev?'הזוגיים':'האי-זוגיים';
  return{multi:true,prompt:`הקיפו רק את המספרים ${w}:`,visual:'',choices:nums,correctSet:cs,answer:cs.join(','),hint:'מסתכלים רק על ספרת האחדות: 0, 2, 4, 6, 8 – זוגי.',
    explain:`<p>מסתכלים רק על ספרת האחדות. זוגי נגמר ב-0, 2, 4, 6 או 8. אי-זוגי נגמר ב-1, 3, 5, 7 או 9.</p><p>המספרים ${w}: <b dir="ltr">${cs.join(', ')}</b></p>`,review:`${w}: ${cs.join(', ')}`}}

function genRegroup(i){const d=D(i);let a,b,op;
  if(d===0){if(i%2===0){op='+';const ao=R(3,9),bo=R(10-ao,9),at=R(1,6),bt=R(1,8-at);a=at*10+ao;b=bt*10+bo}else{op='−';const at=R(3,9),bt=R(1,at-1),ao=R(0,7),bo=R(ao+1,9);a=at*10+ao;b=bt*10+bo}}
  else if(d===1){if(i%2===1){op='+';do{a=R(120,680);b=R(110,890)}while(a+b>999||(a%10+b%10<10&&Math.floor(a/10)%10+Math.floor(b/10)%10<10))}else{op='−';do{a=R(300,980);b=R(110,a-60)}while(a%10>=b%10&&Math.floor(a/10)%10>=Math.floor(b/10)%10)}}
  else if(i===6){op='+';do{a=R(150,600);b=R(150,800)}while(a+b>999||a%10+b%10<10||Math.floor(a/10)%10+Math.floor(b/10)%10<9)}
  else{op='−';const H=R(2,9);a=Math.random()<.7?H*100:H*100+R(1,4);const bh=R(1,H-1);b=bh*100+R(1,9)*10+R(Math.max(1,a%10+1),9);if(b>=a)b=(H-1)*100+R(10,99)}
  const r=op==='+'?a+b:a-b;const trap=op==='+'?noCarry(a,b):absDig(a,b);
  return{prompt:qEq(`${a} ${op} ${b} = ?`),visual:'',answer:r,choices:choicesFrom(r,shuffle([trap,r+10,r-10,r+100,r-1]),0),
    hint:op==='+'?'מתחילים מהאחדות. אם יוצא 10 או יותר – מעבירים 1 לטור הבא.':'מתחילים מהאחדות. אם אין מספיק – פורטים מהטור השכן.',
    explain:`<p>${op==='+'?'מחברים':'מחסרים'} בטורים, ומתחילים מהאחדות:</p>${vis(pvTable(a,b,op))}${colExplain(a,b,op)}<p>${eq(`${a} ${op} ${b} = ${r}`)}</p>`+(op==='+'?(trap!==r?`<p class="alt">אל תשכחו את ה-1 שעבר! בלי המרה יוצא ${trap}, וזה לא נכון.</p>`:''):`<p class="alt">${trap!==r?`טעות נפוצה: להוריד בכל טור את הקטן מהגדול (${trap}). `:''}בודקים בחיבור: ${eq(`${r} + ${b} = ${a}`)}</p>`)}}

const calc=(a,op,b)=>op==='+'?a+b:a-b;
function wpFin(P){if(!P.two){P.r=calc(P.a,P.op,P.b);P.ex=`${P.a} ${P.op} ${P.b} = ${P.r}`}return P}
function wpExplain(P){return `<div class="kw"><div><b>מילת רמז</b><span>״${P.key}״ ← ${P.two?'חיבור ואז חיסור':P.op==='+'?'חיבור':'חיסור'}${P.inv?' (מחזירים את מה שנתן)':''}</span></div><div><b>תרגיל</b><span>${eq(P.ex)}</span></div><div><b>תשובה במילים</b><span>${P.sent(P.r)}</span></div></div><p class="alt">${P.inv?`נתן, ונשארו ${P.a}? כדי לדעת כמה היו בהתחלה, מחזירים את ה-${P.b} שנתן – מוסיפים. בודקים: ${eq(`${P.r} − ${P.b} = ${P.a}`)}`:`זכרו: בתשובה במילים כותבים את התוצאה (${P.r}), ולא את המספר שהתחלנו ממנו. ומעתיקים את המספרים מהבעיה בדיוק!`}</p>`}
function genWP2(i){const d=D(i);const kind=['ans','ex','words'][i%3];const P=wpFin((d===2?pick([WPT_INV,WPT_TWO,WPT_DIFF,...WPT]):d===1?pick([...WPT,WPT_INV]):pick(WPT))(d));
  const story=`<span class="wptxt">${P.txt}</span>`;const base={explain:wpExplain(P),review:`${P.ex} · ${P.sent(P.r)}`,hint:`חפשו את מילת הרמז: ״${P.key}״. והעתיקו את המספרים בדיוק.`};
  if(kind==='ans')return{...base,prompt:`${story}<b>מה התשובה?</b>`,say:P.txt,visual:'',answer:P.r,choices:choicesFrom(P.r,shuffle([P.a,P.r+10,P.r-10,P.r+1,P.two?P.a+P.b+P.c:calc(P.a,P.op==='+'?'−':'+',P.b)]),0)};
  if(kind==='ex'){let wrong;if(P.two)wrong=[`${P.a} − ${P.b} + ${P.c} = ${P.a-P.b+P.c}`,`${P.a} + ${P.b} + ${P.c} = ${P.a+P.b+P.c}`,`${P.a} + ${P.b} = ${P.a+P.b}`];
    else{const opp=P.op==='+'?'−':'+';wrong=[`${P.a} ${P.op} ${P.b+1} = ${calc(P.a,P.op,P.b+1)}`,`${P.a} ${P.op} ${P.b} = ${P.r+10}`];if(calc(P.a,opp,P.b)>=0)wrong.push(`${P.a} ${opp} ${P.b} = ${calc(P.a,opp,P.b)}`);else wrong.push(`${P.a} ${P.op} ${P.b} = ${P.r-1}`)}
    return{...base,prompt:`${story}<b>איזה תרגיל מתאים לבעיה?</b>`,say:P.txt,visual:'',answer:P.ex,choices:choicesStr(P.ex,shuffle(wrong)),small:true,render:tS}}
  const ws=[P.sent(P.a),P.sent(P.b),P.sent(P.r+10)];
  return{...base,prompt:`${story}פתרנו: ${eq(P.ex)}<br><b>איזו תשובה במילים נכונה?</b>`,say:P.txt,visual:'',answer:P.sent(P.r),choices:shuffle([...new Set([P.sent(P.r),P.sent(P.a),P.sent(P.b)])]),sent:true}}
